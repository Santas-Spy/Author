<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GNOME AI Assistant</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cantarell:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg-void: #1e1e1e;
                --bg-headerbar: #2d2d2d;
                --bg-composer: #2d2d2d;
                --bg-sidebar: #232322;
                --bg-card: #333331;
                --bg-card-hover: #3a3a38;
                --accent: #3584e4;
                --accent-hover: #1c71d8;
                --accent-soft: rgba(53, 132, 228, 0.16);
                --text-primary: #f6f5f4;
                --text-secondary: #c0bfbc;
                --text-muted: #8a8a86;
                --border: #444442;
                --danger: #e01b24;
                --danger-soft: rgba(224, 27, 36, 0.14);
                --success: #33d17a;
                --font-ui: "Cantarell", -apple-system, "Segoe UI", sans-serif;
                --font-mono: "JetBrains Mono", ui-monospace, monospace;
                --radius-window: 14px;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
            }

            body {
                font-family: var(--font-ui);
                background: #131313;
                color: var(--text-primary);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .hidden {
                display: none !important;
            }

            /* ---------- App window shell ---------- */

            .app-window {
                width: 100%;
                height: 100%;
                background: var(--bg-void);
                border-radius: var(--radius-window);
                border: 1px solid #0f0f0f;
                box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            /* ---------- Headerbar ---------- */

            .headerbar {
                flex: 0 0 auto;
                background: var(--bg-headerbar);
                border-bottom: 1px solid var(--border);
                padding: 10px 14px;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .window-controls {
                display: flex;
                gap: 7px;
            }

            .window-controls span {
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background: #565654;
            }

            .headerbar-title {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                line-height: 1.25;
            }

            .headerbar-title .name {
                font-weight: 700;
                font-size: 14px;
                letter-spacing: 0.2px;
            }

            .headerbar-title .endpoint {
                font-family: var(--font-mono);
                font-size: 10.5px;
                color: var(--text-muted);
            }

            .status-pill {
                display: flex;
                align-items: center;
                gap: 6px;
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text-secondary);
                padding: 4px 9px;
                border: 1px solid var(--border);
                border-radius: 999px;
                max-width: 220px;
            }

            .status-pill .status-message {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .status-dot {
                flex: 0 0 auto;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--text-muted);
                transition: background 0.2s ease;
            }
            /* Status values come from the server's {"status", "message"} response. */
            .status-dot[data-state="ready"] {
                background: var(--success);
            }
            .status-dot[data-state="working"] {
                background: #f5c211;
                animation: status-pulse 1.1s infinite ease-in-out;
            }
            .status-dot[data-state="disabled"] {
                background: var(--text-muted);
            }
            /* "offline" is set by the frontend only when the status endpoint itself is unreachable. */
            .status-dot[data-state="offline"] {
                background: var(--danger);
            }

            @keyframes status-pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.35;
                }
            }

            .icon-button {
                width: 30px;
                height: 30px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--text-secondary);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .icon-button:hover {
                background: var(--bg-card-hover);
                color: var(--text-primary);
            }
            .icon-button:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .icon-button svg {
                width: 15px;
                height: 15px;
            }

            .icon-button.editing {
                background: var(--accent-soft);
                border-color: var(--accent);
                color: var(--accent);
            }

            /* ---------- Message window layout ---------- */

            .message-window {
                display: flex;
                flex: 1 1 auto;
                min-height: 0;
            }

            .message-panel {
                flex: 1 1 auto;
                min-width: 0;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            /* ---------- Shared sidebar panel styling ---------- */
            /* Used by both the chat list (left) and the chat info panel (right). */

            .sidebar-panel {
                flex: 0 0 auto;
                width: 220px;
                height: 100%;
                background: var(--bg-sidebar);
                overflow-y: auto;
                display: flex;
                flex-direction: column;
            }

            .sidebar-panel::-webkit-scrollbar {
                width: 8px;
            }
            .sidebar-panel::-webkit-scrollbar-thumb {
                background: #3a3a38;
                border-radius: 8px;
            }
            .sidebar-panel::-webkit-scrollbar-track {
                background: transparent;
            }

            .chat-list {
                border-right: 1px solid var(--border);
            }
            .chat-info {
                border-left: 1px solid var(--border);
            }

            .sidebar-heading {
                flex: 0 0 auto;
                font-family: var(--font-mono);
                font-size: 10.5px;
                font-weight: 500;
                letter-spacing: 0.6px;
                text-transform: uppercase;
                color: var(--text-muted);
                padding: 14px 16px 8px;
            }

            .sidebar-empty {
                padding: 4px 16px 14px;
                font-size: 12.5px;
                color: var(--text-muted);
            }

            /* ---------- Chat list items ---------- */

            .chat-item-list {
                display: flex;
                flex-direction: column;
                gap: 2px;
                padding: 0 8px 12px;
            }

            .chat-item {
                position: relative;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
                border-radius: 8px;
                border: none;
                background: transparent;
                color: var(--text-secondary);
                font-family: var(--font-ui);
                font-size: 13.5px;
                text-align: left;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }

            .chat-item:hover {
                background: var(--bg-card-hover);
                color: var(--text-primary);
            }
            .chat-item:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }

            .chat-item.active {
                background: var(--accent-soft);
                color: var(--text-primary);
            }

            .chat-item .chat-item-dot {
                flex: 0 0 auto;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--text-muted);
            }

            .chat-item.active .chat-item-dot {
                background: var(--accent);
            }

            .chat-item-label {
                flex: 1 1 auto;
                display: inline-flex;
                overflow: hidden;
                white-space: nowrap;
            }

            /* Unread chats get a bolder label so the badge isn't the only signal. */
            .chat-item.unread .chat-item-label {
                color: var(--text-primary);
                font-weight: 700;
            }

            /* Each letter is its own inline-block so it can be transformed/animated
     independently — CSS transforms have no effect on plain inline text. */
            .chat-item-label .letter {
                display: inline-block;
                white-space: pre;
            }

            @keyframes letter-fade-out {
                from {
                    opacity: 1;
                    transform: translateY(0);
                }
                to {
                    opacity: 0;
                    transform: translateY(7px);
                }
            }

            @keyframes letter-fade-in {
                from {
                    opacity: 0;
                    transform: translateY(-7px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Unread badge: shown once a chat finishes responding while the user
     was looking at a different chat. Clears when that chat is opened. */
            .chat-item-unread-badge {
                display: none;
                flex: 0 0 auto;
                width: 7px;
                height: 7px;
                margin-left: auto;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-soft);
            }

            .chat-item.unread .chat-item-unread-badge {
                display: block;
                animation: unread-pop 0.25s ease;
            }

            @keyframes unread-pop {
                from {
                    transform: scale(0.3);
                    opacity: 0;
                }
                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            /* ---------- Chat info fields ---------- */

            .info-field-list {
                display: flex;
                flex-direction: column;
                gap: 14px;
                padding: 0 16px 16px;
            }

            .info-field {
                display: flex;
                flex-direction: column;
                gap: 3px;
            }

            .info-field-label {
                font-family: var(--font-mono);
                font-size: 10px;
                font-weight: 500;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                color: var(--text-muted);
            }

            .info-field-value {
                font-size: 13px;
                line-height: 1.45;
                color: var(--text-secondary);
                word-break: break-word;
                white-space: pre-wrap;
            }

            /* ---------- Message list ---------- */

            .message-list {
                flex: 1 1 auto;
                min-width: 0;
                overflow-y: auto;
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .message-list::-webkit-scrollbar {
                width: 8px;
            }
            .message-list::-webkit-scrollbar-thumb {
                background: #3a3a38;
                border-radius: 8px;
            }
            .message-list::-webkit-scrollbar-track {
                background: transparent;
            }

            .message-row {
                display: flex;
                align-items: flex-end;
                gap: 8px;
                max-width: 82%;
            }
            .message-row.assistant {
                align-self: flex-start;
            }
            .message-row.user {
                align-self: flex-end;
                flex-direction: row-reverse;
            }

            .avatar {
                flex: 0 0 auto;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                background: var(--accent-soft);
                color: var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .avatar svg {
                width: 15px;
                height: 15px;
            }

            .bubble {
                padding: 10px 14px;
                border-radius: 16px;
                font-size: 14.5px;
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .message-row.assistant .bubble {
                background: var(--bg-card);
                color: var(--text-primary);
                border-bottom-left-radius: 4px;
            }

            .message-row.user .bubble {
                background: var(--accent);
                color: #ffffff;
                border-bottom-right-radius: 4px;
            }

            .message-row.system .bubble {
                background: var(--danger-soft);
                color: #ffb4b4;
                border: 1px solid rgba(224, 27, 36, 0.35);
            }

            /* ---------- Streamed-token animation ---------- */
            /* Each chunk that arrives from the SSE/stream reader is split into one
     .stream-letter span per character, so text fades/rises into place letter
     by letter instead of the whole bubble re-painting flatly on every chunk.
     This is the same fade-up-in used for chat-item title changes, just much
     faster and with a shorter travel distance so a fast stream reads as
     quick, smooth handwriting rather than a slow reveal. */
            .stream-letter {
                display: inline-block;
                white-space: pre;
                animation: letter-fade-up-in 140ms ease-out both;
            }

            @keyframes letter-fade-up-in {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .stream-letter {
                    animation: none;
                }
            }

            .thinking-dots {
                display: flex;
                gap: 4px;
                padding: 4px 0;
            }
            .thinking-dots span {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--text-muted);
                animation: thinking-bounce 1.1s infinite ease-in-out;
            }
            .thinking-dots span:nth-child(2) {
                animation-delay: 0.15s;
            }
            .thinking-dots span:nth-child(3) {
                animation-delay: 0.3s;
            }

            @keyframes thinking-bounce {
                0%,
                60%,
                100% {
                    transform: translateY(0);
                    opacity: 0.5;
                }
                30% {
                    transform: translateY(-4px);
                    opacity: 1;
                }
            }

            /* ---------- Edit mode (raw transcript editor) ---------- */

            .edit-textarea {
                flex: 1 1 auto;
                min-width: 0;
                width: 100%;
                height: 100%;
                resize: none;
                border: none;
                outline: none;
                background: var(--bg-void);
                color: var(--text-primary);
                font-family: var(--font-mono);
                font-size: 13px;
                line-height: 1.6;
                padding: 20px;
            }
            .edit-textarea::placeholder {
                color: var(--text-muted);
            }
            .edit-textarea::-webkit-scrollbar {
                width: 8px;
            }
            .edit-textarea::-webkit-scrollbar-thumb {
                background: #3a3a38;
                border-radius: 8px;
            }
            .edit-textarea::-webkit-scrollbar-track {
                background: transparent;
            }

            /* ---------- Composer ---------- */

            .composer {
                flex: 0 0 auto;
                background: var(--bg-composer);
                border-top: 1px solid var(--border);
                padding: 10px 14px;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .composer-meta {
                font-family: var(--font-mono);
                font-size: 10.5px;
                color: var(--text-muted);
                padding: 0 4px;
            }

            .composer-form {
                display: flex;
                align-items: flex-end;
                gap: 8px;
            }

            .composer-input {
                flex: 1;
                background: var(--bg-void);
                border: 1px solid var(--border);
                color: var(--text-primary);
                font-family: var(--font-ui);
                font-size: 14px;
                padding: 10px 16px;
                border-radius: 18px;
                outline: none;
                resize: none;
                overflow-y: auto;
                max-height: 140px;
                line-height: 1.4;
                transition: border-color 0.15s ease;
            }
            .composer-input:focus {
                border-color: var(--accent);
            }
            .composer-input::placeholder {
                color: var(--text-muted);
            }
            .composer-input:disabled {
                opacity: 0.6;
            }

            .send-button {
                flex: 0 0 auto;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                border: none;
                background: var(--accent);
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    transform 0.1s ease;
            }
            .send-button:hover:not(:disabled) {
                background: var(--accent-hover);
            }
            .send-button:active:not(:disabled) {
                transform: scale(0.94);
            }
            .send-button:disabled {
                background: var(--bg-card);
                color: var(--text-muted);
                cursor: not-allowed;
            }
            .send-button svg {
                width: 16px;
                height: 16px;
            }

            .process-button {
                flex: 0 0 auto;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                border: none;
                background: var(--accent);
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    transform 0.1s ease;
            }
            .process-button:hover:not(:disabled) {
                background: var(--accent-hover);
            }
            .process-button:active:not(:disabled) {
                transform: scale(0.94);
            }
            .process-button:disabled {
                background: var(--bg-card);
                color: var(--text-muted);
                cursor: not-allowed;
            }
            .process-button svg {
                width: 16px;
                height: 16px;
            }
        </style>
    </head>
    <body>
        <div class="app-window">
            <!-- Headerbar -->
            <header class="headerbar">
                <div class="window-controls" aria-hidden="true">
                    <span></span><span></span><span></span>
                </div>

                <div class="headerbar-title">
                    <span class="name">Author v2</span>
                    <span class="endpoint" id="endpoint-label">chat #0</span>
                </div>

                <div class="status-pill" id="status-pill" title="">
                    <span
                        class="status-dot"
                        id="status-dot"
                        data-state="disabled"
                    ></span>
                    <span class="status-message" id="status-label"
                        >connecting…</span
                    >
                </div>

                <button
                    class="icon-button"
                    id="edit-mode-button"
                    type="button"
                    title="Edit raw chat log"
                    aria-label="Edit raw chat log"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 20h9" />
                        <path
                            d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"
                        />
                    </svg>
                </button>

                <button
                    class="icon-button"
                    id="new-chat-button"
                    type="button"
                    title="Start a new chat"
                    aria-label="Start a new chat"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    >
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                </button>
            </header>

            <main class="message-window" id="message-window">
                <!-- Chat list (left sidebar) -->
                <nav class="sidebar-panel chat-list" id="chat-list">
                    <span class="sidebar-heading">Chats</span>
                    <div class="chat-item-list" id="chat-item-list"></div>
                </nav>

                <!-- Message list / raw-log editor -->
                <div class="message-panel" id="message-panel">
                    <section class="message-list" id="message-list"></section>
                    <textarea
                        class="edit-textarea hidden"
                        id="edit-textarea"
                        spellcheck="false"
                        placeholder="Raw chat transcript…"
                    ></textarea>
                </div>

                <!-- Chat info (right sidebar) -->
                <aside class="sidebar-panel chat-info" id="chat-info">
                    <span class="sidebar-heading">Details</span>
                    <div class="info-field-list" id="info-field-list"></div>
                </aside>
            </main>

            <!-- Composer -->
            <footer class="composer">
                <div class="composer-meta">
                    connected to <span id="api-url-label"></span>
                </div>
                <form class="composer-form" id="chat-form">
                    <textarea
                        id="message-input"
                        class="composer-input"
                        placeholder="Message the assistant... (Shift+Enter for a new line)"
                        autocomplete="off"
                        rows="1"
                    ></textarea>
                    <button
                        type="submit"
                        class="send-button"
                        id="send-button"
                        aria-label="Send message"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" />
                        </svg>
                    </button>
                    <button
                        type="button"
                        class="process-button"
                        id="process-button"
                        aria-label="Process Chat"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="11" cy="11" r="7" />
                            <path d="m20 20-4-4" />
                        </svg>
                    </button>
                </form>
            </footer>
        </div>

        <script>
            "use strict";

            /**
             * ---------------------------------------------------------------------
             * Configuration
             * ---------------------------------------------------------------------
             */
            const CONFIG = {
                apiBaseUrl: "http://192.168.20.43:8000/api/",
                endpoints: {
                    chat: "chat",
                    loadChat: "loadChat",
                    status: "status",
                    listChats: "listChats",
                    updateChat: "updateChat",
                    processChat: "processChat",
                },
                // How often to poll the server for its current status.
                statusPollIntervalMs: 3000,
                // Markers the backend uses to delimit a transcript into turns.
                // A marker attaches to the text segment that PRECEDES it.
                markers: {
                    assistant: "{{[INPUT]}}",
                    user: "{{[OUTPUT]}}",
                },
                // Keys from the loadChat response that are metadata, not the transcript,
                // and so belong in the chat-info panel rather than the message list.
                infoFieldsExcluded: ["text", "title"],
                // Per-letter title-change animation timing.
                titleLetterStaggerMs: 16,
                titleLetterOutMs: 200,
                titleLetterInMs: 240,
                // Max height (px) the composer textarea is allowed to auto-grow to
                // before it starts scrolling instead (kept in sync with the
                // max-height set on .composer-input in CSS).
                composerMaxHeightPx: 140,
                // Per-letter stagger for the streamed-token fade-up-in animation.
                // Kept much tighter than titleLetterStaggerMs so a fast stream still
                // reads as quick, smooth handwriting rather than a slow reveal.
                streamLetterStaggerMs: 16,
            };

            /**
             * ---------------------------------------------------------------------
             * State
             * ---------------------------------------------------------------------
             */
            const state = {
                chatId: 0,
                // Chat ids that finished responding while the user was looking at a
                // different chat. Cleared the moment that chat is opened.
                unreadChatIds: new Set(),
                // Raw transcript text of the chat currently open, kept in sync so edit
                // mode always starts from what's actually on screen.
                rawTranscript: "",
                editMode: false,
            };

            /**
             * ---------------------------------------------------------------------
             * Cached DOM references
             * ---------------------------------------------------------------------
             */
            const dom = {
                messageList: document.getElementById("message-list"),
                editTextarea: document.getElementById("edit-textarea"),
                chatItemList: document.getElementById("chat-item-list"),
                infoFieldList: document.getElementById("info-field-list"),
                chatForm: document.getElementById("chat-form"),
                messageInput: document.getElementById("message-input"),
                sendButton: document.getElementById("send-button"),
                processButton: document.getElementById("process-button"),
                endpointLabel: document.getElementById("endpoint-label"),
                apiUrlLabel: document.getElementById("api-url-label"),
                statusPill: document.getElementById("status-pill"),
                statusDot: document.getElementById("status-dot"),
                statusLabel: document.getElementById("status-label"),
                newChatButton: document.getElementById("new-chat-button"),
                editModeButton: document.getElementById("edit-mode-button"),
            };

            dom.apiUrlLabel.textContent = CONFIG.apiBaseUrl;

            /**
             * ---------------------------------------------------------------------
             * Rendering helpers — message list
             * ---------------------------------------------------------------------
             * All message content is inserted via textContent, so nothing here
             * needs manual HTML-escaping and no markup can be injected.
             */

            const ICONS = {
                assistant: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M9 12v2M15 12v2"/></svg>`,
                edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
                save: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
            };

            function scrollToBottom() {
                dom.messageList.scrollTop = dom.messageList.scrollHeight;
            }

            /** Build a single message row (assistant / user / system) and append it. */
            function appendMessage(role, text) {
                const row = document.createElement("div");
                row.className = `message-row ${role}`;

                if (role === "assistant") {
                    const avatar = document.createElement("div");
                    avatar.className = "avatar";
                    avatar.innerHTML = ICONS.assistant;
                    row.appendChild(avatar);
                }

                const bubble = document.createElement("div");
                bubble.className = "bubble";
                bubble.textContent = text;
                row.appendChild(bubble);

                dom.messageList.appendChild(row);
                scrollToBottom();
                return row;
            }

            /**
             * Append one streamed chunk to a live assistant bubble, fading/rising
             * each character in individually (staggered by
             * CONFIG.streamLetterStaggerMs) rather than animating the whole chunk
             * as one block. Newlines are appended as plain text nodes — animating
             * them has no visual effect and wrapping them in an inline-block span
             * can upset line-wrapping.
             */
             let streamQueue = {bubbleEl: null, text: ""};
             let isAnimatingStream = false;

             function appendStreamedChunk(bubbleEl, text) {
                 if (!text) return;

                 //streamQueue.push({ bubbleEl, text });
                 streamQueue.bubbleEl = bubbleEl
                 streamQueue.text += text
                 processStreamQueue();
             }

             function processStreamQueue() {
                 if (isAnimatingStream || streamQueue.text.length === 0) return;

                 isAnimatingStream = true;

                 //const { bubbleEl, text } = streamQueue.shift();
                 const { bubbleEl, text } = streamQueue;
                 streamQueue = {bubbleEl: null, text: ""};
                 const frag = document.createDocumentFragment();

                 let delayMs = 0;
                 let lastSpan = null;

                 for (const ch of text) {
                     if (ch === "\n") {
                         frag.appendChild(document.createTextNode("\n"));
                         continue;
                     }

                     const span = document.createElement("span");
                     span.className = "stream-letter";
                     span.style.animationDelay = `${delayMs}ms`;
                     span.textContent = ch;

                     frag.appendChild(span);
                     lastSpan = span;

                     var delay = CONFIG.streamLetterStaggerMs;
                     delay /= text.length;
                     delay = Math.max(delay, 0.5);
                     delay = Math.min(delay, 16);
                     delayMs += delay;
                 }

                 bubbleEl.appendChild(frag);

                 // Nothing animated in this chunk.
                 if (!lastSpan) {
                     isAnimatingStream = false;
                     processStreamQueue();
                     return;
                 }

                 // The last character finishes after its delay + animation duration.
                 lastSpan.addEventListener("animationend", () => {
                     isAnimatingStream = false;
                     processStreamQueue();
                 }, { once: true });
             }

            /** Show an animated "thinking" bubble and return it so it can be removed later. */
            function appendThinkingIndicator() {
                const row = appendMessage("assistant", "");
                const bubble = row.querySelector(".bubble");
                bubble.innerHTML = `<div class="thinking-dots"><span></span><span></span><span></span></div>`;
                return row;
            }

            function clearMessages() {
                dom.messageList.innerHTML = "";
            }

            /**
             * ---------------------------------------------------------------------
             * Transcript parsing
             * ---------------------------------------------------------------------
             * The backend returns one string containing the whole conversation,
             * with each turn followed by a marker that names whose turn it was.
             * Example: "hi there{{[OUTPUT]}}hello!{{[INPUT]}}how can I help?{{[INPUT]}}"
             *
             * We split on the markers while keeping them, then walk the pieces in
             * pairs: [text, marker, text, marker, ...]. Each text segment takes the
             * role of the marker that follows it; a trailing segment with no marker
             * defaults to "assistant".
             */
            function parseTranscript(rawText) {
                rawText = rawText.trimStart();
                const markerPattern = new RegExp(
                    `(${escapeRegExp(CONFIG.markers.assistant)}|${escapeRegExp(CONFIG.markers.user)})`,
                );
                const pieces = rawText.split(markerPattern);

                const turns = [];
                for (let i = 0; i < pieces.length; i += 2) {
                    const text = pieces[i];
                    const marker = pieces[i + 1];
                    if (!text) continue;

                    const role =
                        marker === CONFIG.markers.user ? "user" : "assistant";
                    turns.push({ role, text });
                }
                return turns;
            }

            function escapeRegExp(value) {
                return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function renderTranscript(rawText) {
                clearMessages();
                const turns = parseTranscript(rawText);
                if (turns.length === 0) {
                    appendMessage(
                        "assistant",
                        "No messages yet — say hello to get started.",
                    );
                    return;
                }
                turns.forEach(({ role, text }) => appendMessage(role, text));
            }

            /**
             * ---------------------------------------------------------------------
             * Chat info panel (right sidebar)
             * ---------------------------------------------------------------------
             * Renders every field from a loadChat response (other than the transcript
             * text itself) as a labelled field: the key as a small caption above the
             * value, rather than the raw chat-bubble placeholder used previously.
             */
            function formatInfoLabel(key) {
                return key
                    .replace(/([a-z])([A-Z])/g, "$1 $2") // camelCase -> camel Case
                    .replace(/[_-]+/g, " ")
                    .replace(/\s+/g, " ")
                    .trim()
                    .toUpperCase();
            }

            function formatInfoValue(value) {
                if (value === null || value === undefined) return "—";
                if (typeof value === "object")
                    return JSON.stringify(value, null, 2);
                return String(value);
            }

            function renderChatInfo(chatData) {
                dom.infoFieldList.innerHTML = "";

                const entries = Object.entries(chatData).filter(
                    ([key]) => !CONFIG.infoFieldsExcluded.includes(key),
                );

                if (entries.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "sidebar-empty";
                    empty.textContent = "No details for this chat.";
                    dom.infoFieldList.appendChild(empty);
                    return;
                }

                for (const [key, value] of entries) {
                    const field = document.createElement("div");
                    field.className = "info-field";

                    const label = document.createElement("span");
                    label.className = "info-field-label";
                    label.textContent = formatInfoLabel(key);

                    const val = document.createElement("span");
                    val.className = "info-field-value";
                    val.textContent = formatInfoValue(value);

                    field.appendChild(label);
                    field.appendChild(val);
                    dom.infoFieldList.appendChild(field);
                }
            }

            /**
             * ---------------------------------------------------------------------
             * Chat list (left sidebar)
             * ---------------------------------------------------------------------
             */

            /** Replace a label's content with one <span class="letter"> per character, no animation. */
            function setChatItemLabelText(labelEl, text) {
                labelEl.innerHTML = "";
                labelEl.dataset.currentTitle = text;
                const frag = document.createDocumentFragment();
                for (const ch of text) {
                    const span = document.createElement("span");
                    span.className = "letter";
                    span.textContent = ch === " " ? "\u00A0" : ch;
                    frag.appendChild(span);
                }
                labelEl.appendChild(frag);
            }

            /**
             * Swap a chat-item's title with a per-letter fade-down-out / fade-down-in
             * transition: existing letters fade out (staggered), then the new title's
             * letters fade in (staggered) once the old ones have cleared.
             */
            function animateChatItemTitle(labelEl, newTitle) {
                const outSpans = Array.from(
                    labelEl.querySelectorAll(".letter"),
                );

                // Nothing to transition from yet (first render) — just set it.
                if (outSpans.length === 0) {
                    setChatItemLabelText(labelEl, newTitle);
                    return;
                }

                outSpans.forEach((span, i) => {
                    span.style.animation = `letter-fade-out ${CONFIG.titleLetterOutMs}ms ease forwards`;
                    span.style.animationDelay = `${i * CONFIG.titleLetterStaggerMs}ms`;
                });

                const outTotalMs =
                    CONFIG.titleLetterOutMs +
                    outSpans.length * CONFIG.titleLetterStaggerMs;

                setTimeout(() => {
                    setChatItemLabelText(labelEl, newTitle);
                    const inSpans = Array.from(
                        labelEl.querySelectorAll(".letter"),
                    );
                    inSpans.forEach((span, i) => {
                        span.style.animation = `letter-fade-in ${CONFIG.titleLetterInMs}ms ease forwards`;
                        span.style.animationDelay = `${i * CONFIG.titleLetterStaggerMs}ms`;
                    });
                }, outTotalMs);
            }

            function findChatItem(chatId) {
                return dom.chatItemList.querySelector(
                    `.chat-item[data-chat-id="${CSS.escape(String(chatId))}"]`,
                );
            }

            /** Update one chat's title in place (no full list re-render) if it actually changed. */
            function updateChatTitle(chatId, newTitle) {
                if (!newTitle) return;
                const item = findChatItem(chatId);
                if (!item) return;

                const label = item.querySelector(".chat-item-label");
                if (label.dataset.currentTitle === newTitle) return;

                animateChatItemTitle(label, newTitle);
            }

            /** Show/hide the unread badge for one chat without touching the rest of the list. */
            function setChatUnread(chatId, isUnread) {
                const key = String(chatId);
                if (isUnread) {
                    state.unreadChatIds.add(key);
                } else {
                    state.unreadChatIds.delete(key);
                }
                const item = findChatItem(chatId);
                if (item) item.classList.toggle("unread", isUnread);
            }

            /** Disable/enable chat switching — used while a raw-log edit is in progress. */
            function setSidebarNavigationEnabled(enabled) {
                dom.newChatButton.disabled = !enabled;
                dom.chatItemList
                    .querySelectorAll(".chat-item")
                    .forEach((item) => {
                        item.disabled = !enabled;
                    });
            }

            function renderChatList(chats) {
                dom.chatItemList.innerHTML = "";
                if (!chats || chats.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "sidebar-empty";
                    empty.textContent = "No chats yet.";
                    dom.chatItemList.appendChild(empty);
                    return;
                }
                chats.forEach(({ id, title }) => {
                    const item = document.createElement("button");
                    item.type = "button";
                    item.className = "chat-item";
                    item.dataset.chatId = id; // <-- the ID lives here, invisible to the user
                    item.disabled = state.editMode;
                    const isActive = String(id) === String(state.chatId);
                    const isUnread =
                        !isActive && state.unreadChatIds.has(String(id));
                    item.classList.toggle("active", isActive);
                    item.classList.toggle("unread", isUnread);

                    const dot = document.createElement("span");
                    dot.className = "chat-item-dot";

                    const label = document.createElement("span");
                    label.className = "chat-item-label";
                    setChatItemLabelText(label, title || `Chat #${id}`); // <-- what's actually shown

                    const unreadBadge = document.createElement("span");
                    unreadBadge.className = "chat-item-unread-badge";

                    item.appendChild(dot);
                    item.appendChild(label);
                    item.appendChild(unreadBadge);
                    item.addEventListener("click", () => openChat(id)); // closure already has the real id
                    dom.chatItemList.appendChild(item);
                });
            }

            function highlightActiveChatItem() {
                dom.chatItemList
                    .querySelectorAll(".chat-item")
                    .forEach((item) => {
                        item.classList.toggle(
                            "active",
                            item.dataset.chatId === String(state.chatId),
                        );
                    });
            }

            /**
             * ---------------------------------------------------------------------
             * Edit mode (raw transcript editor)
             * ---------------------------------------------------------------------
             * Toggling in swaps the rendered bubble list for a plain textarea seeded
             * with the raw transcript. Toggling out sends whatever's in the textarea
             * to the updateChat endpoint, then reloads the chat so the rendered view
             * reflects what the server actually saved.
             */
            function enterEditMode() {
                state.editMode = true;

                dom.editTextarea.value = state.rawTranscript;
                dom.messageList.classList.add("hidden");
                dom.editTextarea.classList.remove("hidden");

                dom.editModeButton.innerHTML = ICONS.save;
                dom.editModeButton.title = "Save and exit edit mode";
                dom.editModeButton.setAttribute(
                    "aria-label",
                    "Save and exit edit mode",
                );
                dom.editModeButton.classList.add("editing");

                setFormEnabled(false);
                setSidebarNavigationEnabled(false);

                dom.editTextarea.focus();
            }

            async function exitEditModeAndSave() {
                const chatId = state.chatId;
                const editedText = dom.editTextarea.value;

                dom.editModeButton.disabled = true;
                try {
                    await callBackend(CONFIG.endpoints.updateChat, {
                        chat_id: chatId,
                        text: editedText,
                    });
                } catch (error) {
                    appendMessage(
                        "system",
                        `Could not save your edits: ${error.message}`,
                    );
                } finally {
                    dom.editModeButton.disabled = false;
                }

                state.editMode = false;

                dom.editTextarea.classList.add("hidden");
                dom.messageList.classList.remove("hidden");

                dom.editModeButton.innerHTML = ICONS.edit;
                dom.editModeButton.title = "Edit raw chat log";
                dom.editModeButton.setAttribute(
                    "aria-label",
                    "Edit raw chat log",
                );
                dom.editModeButton.classList.remove("editing");

                setFormEnabled(true);
                setSidebarNavigationEnabled(true);

                // Re-fetch so the rendered transcript/info panel reflect what was saved,
                // in case the backend normalized or rejected part of the edit.
                if (chatId === state.chatId) {
                    await loadChat();
                }
            }

            function toggleEditMode() {
                if (state.editMode) {
                    exitEditModeAndSave();
                } else {
                    enterEditMode();
                }
            }

            /**
             * ---------------------------------------------------------------------
             * Server-driven status indicator
             * ---------------------------------------------------------------------
             * The server is the source of truth for what the dot shows. It's polled
             * on an interval and expected to respond with:
             *   { "status": "ready" | "working" | "disabled" | <anything else>, "message": "..." }
             * "status" picks the dot color; "message" is shown as free-form text
             * describing what the server is currently doing.
             *
             * "offline" is the one state the frontend sets itself — only when the
             * status endpoint can't be reached at all.
             */
            function setStatus(status, message) {
                dom.statusDot.dataset.state = status;
                dom.statusLabel.textContent = message || status;
                dom.statusPill.title = message || status;
            }

            async function pollServerStatus() {
                try {
                    const response = await fetch(
                        CONFIG.apiBaseUrl + CONFIG.endpoints.status,
                    );
                    if (!response.ok)
                        throw new Error(
                            `Server responded with status ${response.status}`,
                        );
                    const data = await response.json();

                    const wasWorking =
                        dom.statusDot.dataset.state === "working";
                    setStatus(data.status, data.message);

                    // Background post-processing (title, summary, etc.) just finished for
                    // the chat we're viewing — refresh so the sidebar/info panel catch up.
                    if (
                        wasWorking &&
                        data.status === "ready" &&
                        data.chat_id !== undefined &&
                        String(data.chat_id) === String(state.chatId) &&
                        !state.editMode
                    ) {
                        loadChat();
                    }
                } catch (error) {
                    setStatus(
                        "offline",
                        `Could not reach ${CONFIG.apiBaseUrl}`,
                    );
                }
            }

            function startStatusPolling() {
                pollServerStatus();
                setInterval(pollServerStatus, CONFIG.statusPollIntervalMs);
            }

            /**
             * ---------------------------------------------------------------------
             * Backend communication
             * ---------------------------------------------------------------------
             */
            async function callBackend(endpoint, payload) {
                const response = await fetch(CONFIG.apiBaseUrl + endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    throw new Error(
                        `Server responded with status ${response.status}`,
                    );
                }

                return response.json();
            }

            /**
             * ---------------------------------------------------------------------
             * Actions
             * ---------------------------------------------------------------------
             */
            async function loadChat() {
                const requestChatId = state.chatId;
                const thinkingRow = appendThinkingIndicator();
                try {
                    const data = await callBackend(CONFIG.endpoints.loadChat, {
                        chat_id: requestChatId,
                    });

                    // The user may have switched chats (or entered edit mode) while this
                    // was in flight — only paint the transcript/info panel if they're
                    // still looking at the plain view of this same chat.
                    const stillViewingThisChat =
                        requestChatId === state.chatId && !state.editMode;
                    if (stillViewingThisChat) {
                        thinkingRow.remove();
                        renderTranscript(data.text ?? "");
                        renderChatInfo(data);
                        state.rawTranscript = data.text ?? "";
                    } else {
                        thinkingRow.remove();
                    }

                    if (data.title) updateChatTitle(requestChatId, data.title);
                } catch (error) {
                    thinkingRow.remove();
                    if (requestChatId === state.chatId) {
                        appendMessage(
                            "system",
                            `Could not reach the backend at ${CONFIG.apiBaseUrl}. Make sure the FastAPI server is running.\n(${error.message})`,
                        );
                    }
                }
            }

            async function sendMessage(event) {
                event.preventDefault();

                // Get the user message. If it doesn't exist, continue the conversation
                const message = dom.messageInput.value.trim();
                var continueMode = !message;

                const requestChatId = state.chatId;

                if (!continueMode) {appendMessage("user", message);}

                dom.messageInput.value = "";
                resizeComposerInput();
                setFormEnabled(false);

                let liveBubble = null;

                if (requestChatId === state.chatId && !state.editMode) {
                    const row = appendMessage("assistant", "");
                    liveBubble = row.querySelector(".bubble");
                } else {
                    setChatUnread(requestChatId, true);
                }

                let finalText = "";

                try {
                    const response = await fetch(
                        CONFIG.apiBaseUrl + CONFIG.endpoints.chat,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({
                                chat_id: requestChatId,
                                message: message,
                            }),
                        },
                    );

                    if (!response.ok || !response.body) {
                        throw new Error(
                            `Server responded with status ${response.status}`,
                        );
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    // The server sends newline-delimited JSON (NDJSON).
                    // A network chunk is not necessarily a complete JSON object,
                    // so keep incomplete data in this buffer.
                    let buffer = "";

                    while (true) {
                        const { done, value } = await reader.read();

                        if (done) break;

                        buffer += decoder.decode(value, {
                            stream: true,
                        });

                        const lines = buffer.split("\n");

                        // Keep the final incomplete line for the next chunk.
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.trim()) continue;

                            let data;

                            try {
                                data = JSON.parse(line);
                            } catch (error) {
                                console.error(
                                    "Invalid JSON received from server:",
                                    line,
                                    error,
                                );
                                continue;
                            }

                            switch (data.type) {
                                case "token":
                                    if (
                                        requestChatId === state.chatId &&
                                        !state.editMode &&
                                        liveBubble
                                    ) {
                                        appendStreamedChunk(
                                            liveBubble,
                                            data.token || "",
                                        );
                                        scrollToBottom();
                                    }
                                    break;

                                case "status":
                                    console.log(
                                        "Chat status:",
                                        data.status,
                                        data.message,
                                    );
                                    break;

                                case "complete":
                                    // The backend has finished generating the response.
                                    finalText = data.text || "";
                                    break;

                                case "error":
                                    throw new Error(
                                        data.message ||
                                            "The server returned an error.",
                                    );

                                default:
                                    console.warn(
                                        "Unknown event type from server:",
                                        data,
                                    );
                                    break;
                            }
                        }
                    }

                    // Flush any remaining decoder data.
                    buffer += decoder.decode();

                    // Usually the server terminates every JSON object with \n,
                    // but handle a final unterminated object just in case.
                    if (buffer.trim()) {
                        try {
                            const data = JSON.parse(buffer);

                            switch (data.type) {
                                case "token":
                                    if (
                                        requestChatId === state.chatId &&
                                        !state.editMode &&
                                        liveBubble
                                    ) {
                                        appendStreamedChunk(
                                            liveBubble,
                                            data.token || "",
                                        );
                                        scrollToBottom();
                                    }
                                    break;

                                case "complete":
                                    finalText = data.text || "";
                                    break;

                                case "error":
                                    throw new Error(
                                        data.message ||
                                            "The server returned an error.",
                                    );

                                default:
                                    console.warn(
                                        "Unknown final event type:",
                                        data,
                                    );
                            }
                        } catch (error) {
                            console.error(
                                "Invalid final JSON received from server:",
                                buffer,
                                error,
                            );
                        }
                    }

                    if (!continueMode) {
                    state.rawTranscript +=
                        "{{[INPUT]}}" + message + "{{[OUTPUT]}}" + finalText;
                    }

                    if (requestChatId === state.chatId && !state.editMode) {
                        // Pick up any server-side normalization.
                        await loadChat();
                    }
                } catch (error) {
                    if (requestChatId === state.chatId) {
                        appendMessage(
                            "system",
                            `Could not reach the backend at ${CONFIG.apiBaseUrl}.\n(${error.message})`,
                        );
                    }
                } finally {
                    setFormEnabled(true);
                }
            }

            /** Switch the active chat, refresh the transcript/info panel, and re-sync the sidebar. */
            async function openChat(chatId) {
                // Switching chats abandons any unsaved raw-log edit rather than saving it.
                if (state.editMode) {
                    state.editMode = false;
                    dom.editTextarea.classList.add("hidden");
                    dom.messageList.classList.remove("hidden");
                    dom.editModeButton.innerHTML = ICONS.edit;
                    dom.editModeButton.title = "Edit raw chat log";
                    dom.editModeButton.setAttribute(
                        "aria-label",
                        "Edit raw chat log",
                    );
                    dom.editModeButton.classList.remove("editing");
                    setSidebarNavigationEnabled(true);
                }

                state.chatId = chatId;
                dom.endpointLabel.textContent = `chat #${state.chatId}`;
                clearMessages();
                setChatUnread(chatId, false); // seeing it now — clear any pending unread badge
                highlightActiveChatItem();
                await loadChat();
            }

            async function startNewChat() {
                const nextChatId = Number(state.chatId) + 1;
                await openChat(nextChatId);
                await refreshChatList();
            }

            function setFormEnabled(enabled) {
                dom.messageInput.disabled = !enabled;
                dom.sendButton.disabled = !enabled;
                dom.processButton.disabled = !enabled;
                if (enabled) dom.messageInput.focus();
            }

            /**
             * Grow the composer textarea to fit its content (up to
             * CONFIG.composerMaxHeightPx), then let it scroll internally beyond that.
             * Called on input and after the field is programmatically cleared.
             */
            function resizeComposerInput() {
                dom.messageInput.style.height = "auto";
                const nextHeight = Math.min(
                    dom.messageInput.scrollHeight,
                    CONFIG.composerMaxHeightPx,
                );
                dom.messageInput.style.height = `${nextHeight}px`;
            }

            /**
             * Enter submits the message; Shift+Enter inserts a newline (the
             * textarea's default behavior, so we just let it through).
             */
            function handleComposerKeydown(event) {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    if (typeof dom.chatForm.requestSubmit === "function") {
                        dom.chatForm.requestSubmit();
                    } else {
                        sendMessage(new Event("submit", { cancelable: true }));
                    }
                }
                // Shift+Enter: no preventDefault, so the textarea inserts "\n" itself.
            }

            async function refreshChatList() {
                try {
                    const data = await callBackend(
                        CONFIG.endpoints.listChats,
                        {},
                    );
                    renderChatList(data.chatIDs ?? []);
                } catch (error) {
                    dom.chatItemList.innerHTML = "";
                    const empty = document.createElement("div");
                    empty.className = "sidebar-empty";
                    empty.textContent = "Couldn't load chat list.";
                    dom.chatItemList.appendChild(empty);
                }
            }

            async function processChat() {
                try {
                    console.log(`Processing chat ${state.chatId}`);
                    const data = await callBackend(
                        CONFIG.endpoints.processChat,
                        { chat_id: state.chatId },
                    );
                    if (data.title) updateChatTitle(requestChatId, data.title);
                    refreshChatList();
                } catch (error) {
                    console.error(error);
                }
            }

            /**
             * ---------------------------------------------------------------------
             * Wire up events and boot the app
             * ---------------------------------------------------------------------
             */
            dom.chatForm.addEventListener("submit", sendMessage);
            dom.newChatButton.addEventListener("click", startNewChat);
            dom.editModeButton.addEventListener("click", toggleEditMode);
            dom.processButton.addEventListener("click", processChat);
            dom.messageInput.addEventListener("keydown", handleComposerKeydown);
            dom.messageInput.addEventListener("input", resizeComposerInput);

            dom.endpointLabel.textContent = `chat #${state.chatId}`;
            appendMessage(
                "assistant",
                "Hello! Send a message below to start chatting with your AI backend.",
            );
            loadChat();
            refreshChatList();
            startStatusPolling();
        </script>
    </body>
</html>
