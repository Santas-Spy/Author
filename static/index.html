<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Author</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cantarell:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
        <style>
            :root {
                --bg-void: #1e1e1e;
                --bg-headerbar: #2d2d2d;
                --bg-composer: #2d2d2d;
                --bg-sidebar: #232322;
                --bg-card: #333331;
                --bg-card-hover: #3a3a38;
                --accent: #3584e4;
                --accent-hover: #1c71d8;
                --accent-soft: rgba(53, 132, 228, 0.16);
                --text-primary: #f6f5f4;
                --text-secondary: #c0bfbc;
                --text-muted: #8a8a86;
                --border: #444442;
                --danger: #e01b24;
                --danger-soft: rgba(224, 27, 36, 0.14);
                --success: #33d17a;
                --font-ui: "Cantarell", -apple-system, "Segoe UI", sans-serif;
                --font-mono: "JetBrains Mono", ui-monospace, monospace;
                --radius-window: 14px;
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
                margin: 0;
            }

            body {
                font-family: var(--font-ui);
                background: #131313;
                color: var(--text-primary);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .hidden {
                display: none !important;
            }

            /* ---------- App window shell ---------- */

            .app-window {
                width: 100%;
                height: 100%;
                background: var(--bg-void);
                border-radius: var(--radius-window);
                border: 1px solid #0f0f0f;
                box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            /* ---------- Headerbar ---------- */

            .headerbar {
                flex: 0 0 auto;
                background: var(--bg-headerbar);
                border-bottom: 1px solid var(--border);
                padding: 10px 14px;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .window-controls {
                display: flex;
                gap: 7px;
            }

            .window-controls span {
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background: #565654;
            }

            .headerbar-title {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                line-height: 1.25;
            }

            .headerbar-title .name {
                font-weight: 700;
                font-size: 14px;
                letter-spacing: 0.2px;
            }

            .headerbar-title .endpoint {
                font-family: var(--font-mono);
                font-size: 10.5px;
                color: var(--text-muted);
            }

            .status-pill {
                display: flex;
                align-items: center;
                gap: 6px;
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text-secondary);
                padding: 4px 9px;
                border: 1px solid var(--border);
                border-radius: 999px;
                max-width: 220px;
            }

            .status-pill .status-message {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .status-dot {
                flex: 0 0 auto;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--text-muted);
                transition: background 0.2s ease;
            }
            /* Status values come from the server's {"status", "message"} response. */
            .status-dot[data-state="ready"] {
                background: var(--success);
            }
            .status-dot[data-state="working"] {
                background: #f5c211;
                animation: status-pulse 1.1s infinite ease-in-out;
            }
            .status-dot[data-state="disabled"] {
                background: var(--text-muted);
            }
            /* "offline" is set by the frontend only when the status endpoint itself is unreachable. */
            .status-dot[data-state="offline"] {
                background: var(--danger);
            }

            @keyframes status-pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.35;
                }
            }

            .icon-button {
                width: 30px;
                height: 30px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--text-secondary);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .icon-button:hover {
                background: var(--bg-card-hover);
                color: var(--text-primary);
            }
            .icon-button:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .icon-button svg {
                width: 15px;
                height: 15px;
            }

            .icon-button.editing {
                background: var(--accent-soft);
                border-color: var(--accent);
                color: var(--accent);
            }

            /* ---------- Message window layout ---------- */

            .message-window {
                display: flex;
                flex: 1 1 auto;
                min-height: 0;
            }

            .message-panel {
                flex: 1 1 auto;
                min-width: 0;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            /* ---------- Shared sidebar panel styling ---------- */
            /* Used by both the chat list (left) and the chat info panel (right). */

            .sidebar-panel {
                flex: 0 0 auto;
                width: 220px;
                height: 100%;
                background: var(--bg-sidebar);
                overflow-y: auto;
                display: flex;
                flex-direction: column;
            }

            .sidebar-panel::-webkit-scrollbar {
                width: 8px;
            }
            .sidebar-panel::-webkit-scrollbar-thumb {
                background: #3a3a38;
                border-radius: 8px;
            }
            .sidebar-panel::-webkit-scrollbar-track {
                background: transparent;
            }

            .chat-list {
                border-right: 1px solid var(--border);
            }
            .chat-info {
                border-left: 1px solid var(--border);
            }

            .sidebar-heading {
                flex: 0 0 auto;
                font-family: var(--font-mono);
                font-size: 10.5px;
                font-weight: 500;
                letter-spacing: 0.6px;
                text-transform: uppercase;
                color: var(--text-muted);
                padding: 14px 16px 8px;
            }

            .sidebar-empty {
                padding: 4px 16px 14px;
                font-size: 12.5px;
                color: var(--text-muted);
            }

            /* ---------- Chat list items ---------- */

            .chat-item-list {
                display: flex;
                flex-direction: column;
                gap: 2px;
                padding: 0 8px 12px;
            }

            .chat-item {
                position: relative;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
                border-radius: 8px;
                border: none;
                background: transparent;
                color: var(--text-secondary);
                font-family: var(--font-ui);
                font-size: 13.5px;
                text-align: left;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }

            .chat-item:hover {
                background: var(--bg-card-hover);
                color: var(--text-primary);
            }
            .chat-item:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }

            .chat-item.active {
                background: var(--accent-soft);
                color: var(--text-primary);
            }

            .chat-item .chat-item-dot {
                flex: 0 0 auto;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--text-muted);
            }

            .chat-item.active .chat-item-dot {
                background: var(--accent);
            }

            .chat-item-label {
                flex: 1 1 auto;
                display: inline-flex;
                overflow: hidden;
                white-space: nowrap;
            }

            /* Unread chats get a bolder label so the badge isn't the only signal. */
            .chat-item.unread .chat-item-label {
                color: var(--text-primary);
                font-weight: 700;
            }

            /* Each letter is its own inline-block so it can be transformed/animated
     independently — CSS transforms have no effect on plain inline text. */
            .chat-item-label .letter {
                display: inline-block;
                white-space: pre;
            }

            @keyframes letter-fade-out {
                from {
                    opacity: 1;
                    transform: translateY(0);
                }
                to {
                    opacity: 0;
                    transform: translateY(7px);
                }
            }

            @keyframes letter-fade-in {
                from {
                    opacity: 0;
                    transform: translateY(-7px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* Unread badge: shown once a chat finishes responding while the user
     was looking at a different chat. Clears when that chat is opened. */
            .chat-item-unread-badge {
                display: none;
                flex: 0 0 auto;
                width: 7px;
                height: 7px;
                margin-left: auto;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-soft);
            }

            .chat-item.unread .chat-item-unread-badge {
                display: block;
                animation: unread-pop 0.25s ease;
            }

            @keyframes unread-pop {
                from {
                    transform: scale(0.3);
                    opacity: 0;
                }
                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            /* Per-chat delete button: sits at the far right of the item, hidden
     until the item (or the button itself, for keyboard focus) is hovered
     so the list doesn't look cluttered with delete icons at rest. */
            .chat-item-delete-button {
                flex: 0 0 auto;
                width: 22px;
                height: 22px;
                margin-left: auto;
                border-radius: 6px;
                border: none;
                background: transparent;
                color: var(--text-muted);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                opacity: 0;
                transition:
                    opacity 0.15s ease,
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .chat-item:hover .chat-item-delete-button,
            .chat-item-delete-button:focus-visible {
                opacity: 1;
            }
            .chat-item-delete-button:hover {
                background: var(--danger-soft);
                color: var(--danger);
            }
            .chat-item-delete-button:disabled {
                opacity: 0.3;
                cursor: not-allowed;
            }
            .chat-item-delete-button svg {
                width: 13px;
                height: 13px;
            }

            /* ---------- Chat info fields ---------- */

            .info-field-list {
                display: flex;
                flex-direction: column;
                gap: 14px;
                padding: 0 16px 16px;
            }

            .info-field {
                display: flex;
                flex-direction: column;
                gap: 3px;
            }

            .info-field-label {
                font-family: var(--font-mono);
                font-size: 10px;
                font-weight: 500;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                color: var(--text-muted);
            }

            .info-field-value {
                font-size: 13px;
                line-height: 1.45;
                color: var(--text-secondary);
                word-break: break-word;
                white-space: pre-wrap;
            }

            /* Editable version of .info-field-value, used inside the chat-info
     panel so each field's value can be turned into a real form control.
     Disabled (view mode) it's styled to look just like the old read-only
     span; enabled (edit mode) it gets a visible background/border so it
     reads as an editable field. */
            .info-field-input {
                display: block;
                width: 100%;
                margin: 0;
                border: 1px solid transparent;
                border-radius: 6px;
                padding: 2px 4px;
                background: transparent;
                font-family: inherit;
                resize: none;
                overflow: hidden;
                transition:
                    background 0.15s ease,
                    border-color 0.15s ease;
            }
            .info-field-input:disabled {
                cursor: default;
                color: var(--text-secondary);
            }
            .info-field-input:not(:disabled) {
                background: var(--bg-void);
                border-color: var(--border);
                color: var(--text-primary);
                cursor: text;
            }
            .info-field-input:not(:disabled):focus {
                outline: none;
                border-color: var(--accent);
            }

            /* ---------- Message list ---------- */

            .message-list {
                flex: 1 1 auto;
                min-width: 0;
                overflow-y: auto;
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .message-list::-webkit-scrollbar {
                width: 8px;
            }
            .message-list::-webkit-scrollbar-thumb {
                background: #3a3a38;
                border-radius: 8px;
            }
            .message-list::-webkit-scrollbar-track {
                background: transparent;
            }

            .message-row {
                display: flex;
                align-items: flex-end;
                gap: 8px;
                max-width: 82%;
            }
            .message-row.assistant {
                align-self: flex-start;
            }
            .message-row.user {
                align-self: flex-end;
                flex-direction: row-reverse;
            }

            .avatar {
                flex: 0 0 auto;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                background: var(--accent-soft);
                color: var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .avatar svg {
                width: 15px;
                height: 15px;
            }

            .bubble {
                padding: 10px 14px;
                border-radius: 16px;
                font-size: 14.5px;
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
            }

            .message-row.assistant .bubble {
                background: var(--bg-card);
                color: var(--text-primary);
                border-bottom-left-radius: 4px;
            }

            .message-row.user .bubble {
                background: var(--accent);
                color: #ffffff;
                border-bottom-right-radius: 4px;
            }

            .message-row.system .bubble {
                background: var(--danger-soft);
                color: #ffb4b4;
                border: 1px solid rgba(224, 27, 36, 0.35);
            }

            /* ---------- Markdown content (rendered inside bubbles) ---------- */
            /* .bubble already sets white-space: pre-wrap for the plain-text/system
     case, which would visually double-space rendered markdown (since markdown
     elements already carry their own margins). Reset that just for rendered
     markdown content. */
            .markdown-content {
                white-space: normal;
            }
            .markdown-content > *:first-child {
                margin-top: 0;
            }
            .markdown-content > *:last-child {
                margin-bottom: 0;
            }
            .markdown-content p {
                margin: 0 0 0.6em;
            }
            .markdown-content ul,
            .markdown-content ol {
                margin: 0.4em 0 0.6em;
                padding-left: 1.4em;
            }
            .markdown-content li {
                margin: 0.15em 0;
            }
            .markdown-content a {
                color: inherit;
                text-decoration: underline;
                text-decoration-color: currentColor;
                opacity: 0.9;
            }
            .markdown-content a:hover {
                opacity: 1;
            }
            .markdown-content code {
                font-family: var(--font-mono);
                font-size: 0.9em;
                background: rgba(0, 0, 0, 0.25);
                padding: 0.1em 0.35em;
                border-radius: 4px;
            }
            .message-row.user .markdown-content code {
                background: rgba(0, 0, 0, 0.2);
            }
            .markdown-content pre {
                background: rgba(0, 0, 0, 0.32);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 8px;
                padding: 10px 12px;
                overflow-x: auto;
                margin: 0.5em 0;
            }
            .markdown-content pre code {
                background: none;
                padding: 0;
                font-size: 0.85em;
                line-height: 1.5;
            }
            .markdown-content blockquote {
                margin: 0.5em 0;
                padding-left: 0.8em;
                border-left: 3px solid rgba(255, 255, 255, 0.25);
                color: var(--text-secondary);
            }
            .message-row.user .markdown-content blockquote {
                color: rgba(255, 255, 255, 0.85);
                border-left-color: rgba(255, 255, 255, 0.4);
            }
            .markdown-content h1,
            .markdown-content h2,
            .markdown-content h3,
            .markdown-content h4 {
                margin: 0.6em 0 0.35em;
                line-height: 1.3;
            }
            .markdown-content h1 {
                font-size: 1.25em;
            }
            .markdown-content h2 {
                font-size: 1.15em;
            }
            .markdown-content h3 {
                font-size: 1.05em;
            }
            .markdown-content hr {
                border: none;
                border-top: 1px solid rgba(255, 255, 255, 0.15);
                margin: 0.6em 0;
            }
            .markdown-content table {
                border-collapse: collapse;
                margin: 0.5em 0;
                font-size: 0.92em;
            }
            .markdown-content th,
            .markdown-content td {
                border: 1px solid rgba(255, 255, 255, 0.15);
                padding: 4px 8px;
            }
            .markdown-content img {
                max-width: 100%;
                border-radius: 6px;
            }

            /* ---------- Thinking dropdown (<think>...</think> content) ---------- */

            .think-block {
                margin: 0 0 0.6em;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: rgba(0, 0, 0, 0.18);
                overflow: hidden;
            }
            .think-block:last-child {
                margin-bottom: 0;
            }
            .think-block summary {
                list-style: none;
                cursor: pointer;
                padding: 7px 12px;
                font-family: var(--font-mono);
                font-size: 11px;
                letter-spacing: 0.4px;
                text-transform: uppercase;
                color: var(--text-muted);
                display: flex;
                align-items: center;
                gap: 6px;
                user-select: none;
            }
            .think-block summary::-webkit-details-marker {
                display: none;
            }
            .think-block summary::before {
                content: "▶";
                font-size: 9px;
                transition: transform 0.15s ease;
                display: inline-block;
            }
            .think-block[open] summary::before {
                transform: rotate(90deg);
            }
            .think-block summary:hover {
                color: var(--text-secondary);
            }
            .think-content {
                padding: 2px 12px 10px;
                font-size: 13px;
                color: var(--text-secondary);
                border-top: 1px solid var(--border);
                padding-top: 8px;
            }
            .message-row.user .think-block {
                background: rgba(0, 0, 0, 0.15);
                border-color: rgba(255, 255, 255, 0.2);
            }

            /* ---------- Streamed-token animation ---------- */
            /* Each chunk that arrives from the SSE/stream reader is split into one
     .stream-letter span per character, so text fades/rises into place letter
     by letter instead of the whole bubble re-painting flatly on every chunk.
     This is the same fade-up-in used for chat-item title changes, just much
     faster and with a shorter travel distance so a fast stream reads as
     quick, smooth handwriting rather than a slow reveal. */
            .stream-letter {
                display: inline-block;
                white-space: pre;
                animation: letter-fade-up-in 140ms ease-out both;
            }

            @keyframes letter-fade-up-in {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .stream-letter {
                    animation: none;
                }
            }

            .thinking-dots {
                display: flex;
                gap: 4px;
                padding: 4px 0;
            }
            .thinking-dots span {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--text-muted);
                animation: thinking-bounce 1.1s infinite ease-in-out;
            }
            .thinking-dots span:nth-child(2) {
                animation-delay: 0.15s;
            }
            .thinking-dots span:nth-child(3) {
                animation-delay: 0.3s;
            }

            @keyframes thinking-bounce {
                0%,
                60%,
                100% {
                    transform: translateY(0);
                    opacity: 0.5;
                }
                30% {
                    transform: translateY(-4px);
                    opacity: 1;
                }
            }

            /* ---------- Edit mode (raw transcript editor) ---------- */

            .edit-textarea {
                flex: 1 1 auto;
                min-width: 0;
                width: 100%;
                height: 100%;
                resize: none;
                border: none;
                outline: none;
                background: var(--bg-void);
                color: var(--text-primary);
                font-family: var(--font-mono);
                font-size: 13px;
                line-height: 1.6;
                padding: 20px;
            }
            .edit-textarea::placeholder {
                color: var(--text-muted);
            }
            .edit-textarea::-webkit-scrollbar {
                width: 8px;
            }
            .edit-textarea::-webkit-scrollbar-thumb {
                background: #3a3a38;
                border-radius: 8px;
            }
            .edit-textarea::-webkit-scrollbar-track {
                background: transparent;
            }

            /* ---------- Composer ---------- */

            .composer {
                flex: 0 0 auto;
                background: var(--bg-composer);
                border-top: 1px solid var(--border);
                padding: 10px 14px;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .composer-meta {
                font-family: var(--font-mono);
                font-size: 10.5px;
                color: var(--text-muted);
                padding: 0 4px;
            }

            .composer-form {
                display: flex;
                align-items: flex-end;
                gap: 8px;
            }

            .composer-input {
                flex: 1;
                background: var(--bg-void);
                border: 1px solid var(--border);
                color: var(--text-primary);
                font-family: var(--font-ui);
                font-size: 14px;
                padding: 10px 16px;
                border-radius: 18px;
                outline: none;
                resize: none;
                overflow-y: auto;
                max-height: 140px;
                line-height: 1.4;
                transition: border-color 0.15s ease;
            }
            .composer-input:focus {
                border-color: var(--accent);
            }
            .composer-input::placeholder {
                color: var(--text-muted);
            }
            .composer-input:disabled {
                opacity: 0.6;
            }

            .send-button {
                flex: 0 0 auto;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                border: none;
                background: var(--accent);
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    transform 0.1s ease;
            }
            .send-button:hover:not(:disabled) {
                background: var(--accent-hover);
            }
            .send-button:active:not(:disabled) {
                transform: scale(0.94);
            }
            .send-button:disabled {
                background: var(--bg-card);
                color: var(--text-muted);
                cursor: not-allowed;
            }
            .send-button svg {
                width: 16px;
                height: 16px;
            }

            .process-button {
                flex: 0 0 auto;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                border: none;
                background: var(--accent);
                color: #ffffff;

        </style>
    </head>
    <body>
        <div class="app-window">
            <!-- Headerbar -->
            <header class="headerbar">
                <div class="window-controls" aria-hidden="true">
                    <span></span><span></span><span></span>
                </div>

                <div class="headerbar-title">
                    <span class="name">Author v2</span>
                    <span class="endpoint" id="endpoint-label">chat #0</span>
                </div>

                <div class="status-pill" id="status-pill" title="">
                    <span
                        class="status-dot"
                        id="status-dot"
                        data-state="disabled"
                    ></span>
                    <span class="status-message" id="status-label"
                        >connecting…</span
                    >
                </div>

                <button
                    class="icon-button"
                    id="edit-mode-button"
                    type="button"
                    title="Edit raw chat log"
                    aria-label="Edit raw chat log"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 20h9" />
                        <path
                            d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"
                        />
                    </svg>
                </button>

                <button
                    class="icon-button"
                    id="new-chat-button"
                    type="button"
                    title="Start a new chat"
                    aria-label="Start a new chat"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    >
                        <path d="M12 5v14M5 12h14" />
                    </svg>

            </header>

            <main class="message-window" id="message-window">
                <!-- Chat list (left sidebar) -->

                    <span class="sidebar-heading">Chats</span>
                    <div class="chat-item-list" id="chat-item-list"></div>
                    <button
                        class="delete-all-chats-button icon-button"
                        id="delete-all-chats-button"
                        type="button"
                        title="Delete All Chats"
                        aria-label="Delete All Chats"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M3 6h18" />
                            <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
                            <path d="M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6" />
                            <path d="M10 11v6" />
                            <path d="M14 11v6" />

                <!-- Message list / raw-log editor -->
                <div class="message-panel" id="message-panel">
                    <section class="message-list" id="message-list"></section>

                <!-- Chat info (right sidebar) -->

            <!-- Composer -->
            <footer class="composer">
                <div class="composer-meta">
                    connected to <span id="api-url-label"></span>
                </div>
                <form class="composer-form" id="chat-form">
                    <textarea
                        id="message-input"
                        class="composer-input"
                        placeholder="Message the assistant... (Shift+Enter for a new line)"
                        autocomplete="off"
                        rows="1"
                    ></textarea>
                    <button
                        type="submit"
                        class="send-button"
                        id="send-button"
                        aria-label="Send message"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" />
