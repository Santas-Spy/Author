<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Author</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cantarell:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" type="image/png" href="/static/assets/favicon.png" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <style>
            :root {
                --bg-void: #1e1e1e;
                --bg-headerbar: #2d2d2d;
                --bg-composer: #2d2d2d;
                --bg-sidebar: #232322;
                --bg-card: #333331;
                --bg-card-hover: #3a3a38;
                --accent: #3584e4;
                --accent-hover: #1c71d8;
                --accent-soft: rgba(53, 132, 228, 0.16);
                --text-primary: #f6f5f4;
                --text-secondary: #c0bfbc;
                --text-muted: #8a8a86;
                --border: #444442;
                --danger: #e01b24;
                --danger-soft: rgba(224, 27, 36, 0.14);
                --success: #33d17a;
                --font-ui: "Cantarell", -apple-system, "Segoe UI", sans-serif;
                --font-mono: "JetBrains Mono", ui-monospace, monospace;
                --radius-window: 14px;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                font-family: var(--font-ui);
                background: #131313;
                color: var(--text-primary);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .hidden {
                display: none !important;
            }

            /* ---------- App window shell ---------- */
            .app-window {
                width: 100%;
                height: 100%;
                background: var(--bg-void);
                border-radius: var(--radius-window);
                border: 1px solid #0f0f0f;
                box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            /* ---------- Headerbar ---------- */
            .headerbar {
                flex: 0 0 auto;
                background: var(--bg-headerbar);
                border-bottom: 1px solid var(--border);
                padding: 10px 14px;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .window-controls {
                display: flex;
                gap: 7px;
            }
            .window-controls span {
                width: 11px;
                height: 11px;
                border-radius: 50%;
                background: #565654;
            }
            .headerbar-title {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                line-height: 1.25;
            }
            .headerbar-title .name {
                font-weight: 700;
                font-size: 14px;
                letter-spacing: 0.2px;
            }
            .headerbar-title .endpoint {
                font-family: var(--font-mono);
                font-size: 10.5px;
                color: var(--text-muted);
            }

            .status-pill {
                display: flex;
                align-items: center;
                gap: 6px;
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text-secondary);
                padding: 4px 9px;
                border: 1px solid var(--border);
                border-radius: 999px;
                max-width: 20%;
            }
            .status-pill .status-message {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .status-dot {
                flex: 0 0 auto;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--text-muted);
                transition: background 0.2s ease;
            }
            .status-dot[data-state="ready"] {
                background: var(--success);
            }
            .status-dot[data-state="working"] {
                background: #f5c211;
                animation: status-pulse 1.1s infinite ease-in-out;
            }
            .status-dot[data-state="disabled"] {
                background: var(--text-muted);
            }
            .status-dot[data-state="offline"] {
                background: var(--danger);
            }
            @keyframes status-pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.35;
                }
            }

            .icon-button {
                width: 30px;
                height: 30px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--text-secondary);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .icon-button:hover {
                background: var(--bg-card-hover);
                color: var(--text-primary);
            }
            .icon-button:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .icon-button svg {
                width: 15px;
                height: 15px;
            }
            .icon-button.editing {
                background: var(--accent-soft);
                border-color: var(--accent);
                color: var(--accent);
            }

            /* ---------- Message window layout ---------- */
            .message-window {
                display: flex;
                flex: 1 1 auto;
                min-height: 0;
            }
            .message-panel {
                flex: 1 1 auto;
                min-width: 0;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }

            /* ---------- Sidebar panels ---------- */
            .sidebar-panel {
                flex: 0 0 auto;
                min-width: 100px;
                max-width: 300px;
                height: 100%;
                background: var(--bg-sidebar);
                overflow-y: auto;
                display: flex;
                flex-direction: column;
            }
            .sidebar-panel::-webkit-scrollbar {
                width: 8px;
            }
            .sidebar-panel::-webkit-scrollbar-thumb {
                background: #3a3a38;
                border-radius: 8px;
            }
            .sidebar-panel::-webkit-scrollbar-track {
                background: transparent;
            }
            .chat-list {
                border-right: 1px solid var(--border);
            }
            .chat-info {
                border-left: 1px solid var(--border);
            }
            .sidebar-heading {
                flex: 0 0 auto;
                font-family: var(--font-mono);
                font-size: 10.5px;
                font-weight: 500;
                letter-spacing: 0.6px;
                text-transform: uppercase;
                color: var(--text-muted);
                padding: 14px 16px 8px;
            }
            .sidebar-empty {
                padding: 4px 16px 14px;
                font-size: 12.5px;
                color: var(--text-muted);
            }

            /* ---------- Chat list items ---------- */
            .chat-item-list {
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding: 0 8px 12px;
            }
            .chat-item {
                position: relative;
                display: flex;
                align-items: center;
                gap: 4px;
                padding: 2px 2px;
                border-radius: 8px;
                border: none;
                background: transparent;
                color: var(--text-secondary);
                font-family: var(--font-ui);
                font-size: 12px;
                text-align: left;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .chat-item:hover {
                background: var(--bg-card-hover);
                color: var(--text-primary);
            }
            .chat-item:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            .chat-item.active {
                background: var(--accent-soft);
                color: var(--text-primary);
            }
            .chat-item .chat-item-dot {
                flex: 0 0 auto;
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--text-muted);
            }
            .chat-item.active .chat-item-dot {
                background: var(--accent);
            }
            .chat-item-label {
                flex: 1 1 auto;
                display: inline-flex;
                overflow: hidden;
                white-space: nowrap;
            }
            .chat-item.unread .chat-item-label {
                color: var(--text-primary);
                font-weight: 700;
            }
            .chat-item-label .letter {
                display: inline-block;
                white-space: pre;
            }
            @keyframes letter-fade-out {
                from {
                    opacity: 1;
                    transform: translateY(0);
                }
                to {
                    opacity: 0;
                    transform: translateY(7px);
                }
            }
            @keyframes letter-fade-in {
                from {
                    opacity: 0;
                    transform: translateY(-7px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .chat-item-unread-badge {
                display: none;
                flex: 0 0 auto;
                width: 7px;
                height: 7px;
                margin-left: auto;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 0 3px var(--accent-soft);
            }
            .chat-item.unread .chat-item-unread-badge {
                display: block;
                animation: unread-pop 0.25s ease;
            }
            @keyframes unread-pop {
                from {
                    transform: scale(0.3);
                    opacity: 0;
                }
                to {
                    transform: scale(1);
                    opacity: 1;
                }
            }
            .chat-item-delete-button {
                flex: 0 0 auto;
                width: 22px;
                height: 22px;
                margin-left: auto;
                border-radius: 6px;
                border: none;
                background: transparent;
                color: var(--text-muted);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                opacity: 0;
                transition:
                    opacity 0.15s ease,
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .chat-item:hover .chat-item-delete-button,
            .chat-item-delete-button:focus-visible {
                opacity: 1;
            }
            .chat-item-delete-button:hover {
                background: var(--danger-soft);
                color: var(--danger);
            }
            .chat-item-delete-button:disabled {
                opacity: 0.3;
                cursor: not-allowed;
            }
            .chat-item-delete-button svg {
                width: 13px;
                height: 13px;
            }
            .thinking-remove-button {
                flex: 0 0 auto;
                width: 22px;
                height: 22px;
                margin-left: auto;
                border-radius: 6px;
                border: none;
                background: transparent;
                color: var(--text-muted);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                opacity: 0.8;
                transition:
                    opacity 0.15s ease,
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .thinking-remove-button:hover {
                background: var(--danger-soft);
                color: var(--danger);
            }
            .thinking-remove-button svg {
                width: 13px;
                height: 13px;
            }

            /* ---------- Chat info fields ---------- */
            .info-field-list {
                display: flex;
                flex-direction: column;
                gap: 14px;
                padding: 0 16px 16px;
            }
            .info-field {
                display: flex;
                flex-direction: column;
                gap: 3px;
            }
            .info-field-label {
                font-family: var(--font-mono);
                font-size: 10px;
                font-weight: 500;
                letter-spacing: 0.5px;
                text-transform: uppercase;
                color: var(--text-muted);
            }
            .info-field-value {
                font-size: 13px;
                line-height: 1.45;
                color: var(--text-secondary);
                word-break: break-word;
                white-space: pre-wrap;
                padding: 2px;
                max-height: 190px;
                overflow-y: auto;
            }
            .info-field-input {
                display: block;
                width: 100%;
                margin: 0;
                border: 1px solid transparent;
                border-radius: 6px;
                padding: 2px 4px;
                background: transparent;
                font-family: inherit;
                resize: none;
                overflow: hidden;
                transition:
                    background 0.15s ease,
                    border-color 0.15s ease;
                box-sizing: border-box;
                max-height: 190px;
                overflow-y: auto;
            }
            .info-field-input:disabled {
                cursor: default;
                color: var(--text-secondary);
            }
            .info-field-input:not(:disabled) {
                background: var(--bg-void);
                border-color: var(--border);
                color: var(--text-primary);
                cursor: text;
            }
            .info-field-input:not(:disabled):focus {
                outline: none;
                border-color: var(--accent);
            }

            /* ---------- Message list ---------- */
            .message-list {
                flex: 1 1 auto;
                min-width: 0;
                overflow-y: auto;
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .message-list::-webkit-scrollbar {
                width: 8px;
            }
            .message-list::-webkit-scrollbar-thumb {
                background: #3a3a38;
                border-radius: 8px;
            }
            .message-list::-webkit-scrollbar-track {
                background: transparent;
            }
            .message-row {
                display: flex;
                align-items: flex-end;
                gap: 8px;
                max-width: 82%;
            }
            .message-row.assistant {
                align-self: flex-start;
            }
            .message-row.user {
                align-self: flex-end;
                flex-direction: row-reverse;
            }
            .avatar {
                flex: 0 0 auto;
                width: 26px;
                height: 26px;
                border-radius: 50%;
                background: var(--accent-soft);
                color: var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .avatar svg {
                width: 15px;
                height: 15px;
            }
            .bubble {
                padding: 10px 14px;
                border-radius: 16px;
                font-size: 14.5px;
                max-width: 100%;
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .message-row.assistant .bubble {
                background: var(--bg-card);
                color: var(--text-primary);
                border-bottom-left-radius: 4px;
            }
            .message-row.user .bubble {
                background: var(--accent);
                color: #ffffff;
                border-bottom-right-radius: 4px;
            }
            .message-row.system .bubble {
                background: var(--danger-soft);
                color: #ffb4b4;
                border: 1px solid rgba(224, 27, 36, 0.35);
            }

            /* ---------- Markdown content ---------- */
            .markdown-content {
                white-space: normal;
            }
            .markdown-content > *:first-child {
                margin-top: 0;
            }
            .markdown-content > *:last-child {
                margin-bottom: 0;
            }
            .markdown-content p {
                margin: 0 0 0.6em;
            }
            .markdown-content ul,
            .markdown-content ol {
                margin: 0.4em 0 0.6em;
                padding-left: 1.4em;
            }
            .markdown-content li {
                margin: 0.15em 0;
            }
            .markdown-content a {
                color: inherit;
                text-decoration: underline;
                opacity: 0.9;
            }
            .markdown-content a:hover {
                opacity: 1;
            }
            .markdown-content code {
                font-family: var(--font-mono);
                font-size: 0.9em;
                background: rgba(0, 0, 0, 0.25);
                padding: 0.1em 0.35em;
                border-radius: 4px;
            }
            .message-row.user .markdown-content code {
                background: rgba(0, 0, 0, 0.2);
            }
            .markdown-content pre {
                background: rgba(0, 0, 0, 0.32);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 8px;
                padding: 30px 12px 10px 12px;
                overflow-x: auto;
                margin: 0.5em 0;
                position: relative;
            }
            .markdown-content pre ::selection {
                background: rgba(255, 255, 255, 0.2);
            }
            .markdown-content pre code {
                background: none;
                padding: 0;
                font-size: 0.85em;
                line-height: 1.5;
            }
            .markdown-content table {
                display: block;
                overflow-x: auto;
            }
            .markdown-content blockquote {
                margin: 0.5em 0;
                padding-left: 0.8em;
                border-left: 3px solid rgba(255, 255, 255, 0.25);
                color: var(--text-secondary);
            }
            .message-row.user .markdown-content blockquote {
                color: rgba(255, 255, 255, 0.85);
                border-left-color: rgba(255, 255, 255, 0.4);
            }
            .markdown-content h1,
            .markdown-content h2,
            .markdown-content h3,
            .markdown-content h4 {
                margin: 0.6em 0 0.35em;
                line-height: 1.3;
            }
            .markdown-content h1 {
                font-size: 1.25em;
            }
            .markdown-content h2 {
                font-size: 1.15em;
            }
            .markdown-content h3 {
                font-size: 1.05em;
            }
            .markdown-content hr {
                border: none;
                border-top: 1px solid rgba(255, 255, 255, 0.15);
                margin: 0.6em 0;
            }
            .markdown-content table {
                border-collapse: collapse;
                margin: 0.5em 0;
                font-size: 0.92em;
            }
            .markdown-content th,
            .markdown-content td {
                border: 1px solid rgba(255, 255, 255, 0.15);
                padding: 4px 8px;
            }
            .markdown-content img {
                max-width: 100%;
                border-radius: 6px;
            }
            .code-lang-label {
                position: absolute;
                top: 8px;
                left: 8px;
                font-size: 0.75em;
                background: rgba(255, 255, 255, 0.1);
                border: none;
                border-radius: 4px;
                padding: 2px 4px;
                color: var(--text-secondary);
                opacity: 0.7;
            }
            .code-copy-btn {
                position: absolute;
                top: 6px;
                right: 8px;
                background: rgba(255, 255, 255, 0.1);
                border: none;
                border-radius: 4px;
                padding: 4px 8px;
                font-size: 0.75em;
                color: var(--text-secondary);
                cursor: pointer;
                transition: background 0.2s;
            }
            .code-copy-btn:hover {
                background: rgba(255, 255, 255, 0.2);
                color: var(--text-primary);
            }

            /* ---------- Think blocks ---------- */
            .think-block {
                margin: 0 0 0.6em;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: rgba(0, 0, 0, 0.18);
                overflow: hidden;
            }
            .think-block:last-child {
                margin-bottom: 0;
            }
            .think-block summary {
                list-style: none;
                cursor: pointer;
                padding: 7px 12px;
                font-family: var(--font-mono);
                font-size: 11px;
                letter-spacing: 0.4px;
                text-transform: uppercase;
                color: var(--text-muted);
                display: flex;
                align-items: center;
                gap: 6px;
                user-select: none;
            }
            .think-block summary::-webkit-details-marker {
                display: none;
            }
            .think-block summary::before {
                content: "▶";
                font-size: 9px;
                transition: transform 0.15s ease;
                display: inline-block;
            }
            .think-block[open] summary::before {
                transform: rotate(90deg);
            }
            .think-block summary:hover {
                color: var(--text-secondary);
            }
            .think-content {
                padding: 2px 12px 10px;
                font-size: 13px;
                color: var(--text-secondary);
                border-top: 1px solid var(--border);
                padding-top: 8px;
            }
            .message-row.user .think-block {
                background: rgba(0, 0, 0, 0.15);
                border-color: rgba(255, 255, 255, 0.2);
            }

            /* ---------- Stream animation ---------- */
            .stream-letter {
                display: inline-block;
                white-space: pre;
                animation: letter-fade-up-in 140ms ease-out both;
            }
            @keyframes letter-fade-up-in {
                from {
                    opacity: 0;
                    transform: translateY(6px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .stream-letter {
                    animation: none;
                }
            }
            .thinking-dots {
                display: flex;
                gap: 4px;
                padding: 4px 0;
            }
            .thinking-dots span {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--text-muted);
                animation: thinking-bounce 1.1s infinite ease-in-out;
            }
            .thinking-dots span:nth-child(2) {
                animation-delay: 0.15s;
            }
            .thinking-dots span:nth-child(3) {
                animation-delay: 0.3s;
            }
            @keyframes thinking-bounce {
                0%,
                60%,
                100% {
                    transform: translateY(0);
                    opacity: 0.5;
                }
                30% {
                    transform: translateY(-4px);
                    opacity: 1;
                }
            }

            /* ---------- Edit mode ---------- */
            .edit-textarea {
                flex: 1 1 auto;
                min-width: 0;
                width: 100%;
                height: 100%;
                resize: none;
                border: none;
                outline: none;
                background: var(--bg-void);
                color: var(--text-primary);
                font-family: var(--font-mono);
                font-size: 13px;
                line-height: 1.6;
                padding: 20px;
            }
            .edit-textarea::placeholder {
                color: var(--text-muted);
            }
            .edit-textarea::-webkit-scrollbar {
                width: 8px;
            }
            .edit-textarea::-webkit-scrollbar-thumb {
                background: #3a3a38;
                border-radius: 8px;
            }
            .edit-textarea::-webkit-scrollbar-track {
                background: transparent;
            }

            /* ---------- Composer ---------- */
            .composer {
                flex: 0 0 auto;
                background: var(--bg-composer);
                border-top: 1px solid var(--border);
                padding: 10px 14px;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .composer-meta {
                font-family: var(--font-mono);
                font-size: 10.5px;
                color: var(--text-muted);
                padding: 0 4px;
            }
            .composer-form {
                display: flex;
                align-items: flex-end;
                gap: 8px;
            }
            .composer-input {
                flex: 1;
                background: var(--bg-void);
                border: 1px solid var(--border);
                color: var(--text-primary);
                font-family: var(--font-ui);
                font-size: 14px;
                padding: 10px 16px;
                border-radius: 18px;
                outline: none;
                resize: none;
                overflow-y: auto;
                max-height: 140px;
                line-height: 1.4;
                transition: border-color 0.15s ease;
            }
            .composer-input:focus {
                border-color: var(--accent);
            }
            .composer-input::placeholder {
                color: var(--text-muted);
            }
            .composer-input:disabled {
                opacity: 0.6;
            }
            .send-button,
            .process-button {
                flex: 0 0 auto;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                border: none;
                background: var(--accent);
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    transform 0.1s ease;
            }
            .send-button:hover:not(:disabled),
            .process-button:hover:not(:disabled) {
                background: var(--accent-hover);
            }
            .send-button:active:not(:disabled),
            .process-button:active:not(:disabled) {
                transform: scale(0.94);
            }
            .send-button:disabled,
            .process-button:disabled {
                background: var(--bg-card);
                color: var(--text-muted);
                cursor: not-allowed;
            }
            .send-button svg,
            .process-button svg {
                width: 16px;
                height: 16px;
            }
            .cancel-button {
                flex: 0 0 auto;
                width: 38px;
                height: 38px;
                border-radius: 50%;
                border: none;
                background: var(--danger);
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    transform 0.1s ease;
            }
            .cancel-button:hover:not(:disabled) {
                background: #c9151d;
            }
            .cancel-button:active:not(:disabled) {
                transform: scale(0.94);
            }
            .cancel-button:disabled {
                background: var(--bg-card);
                color: var(--text-muted);
                cursor: not-allowed;
            }
            .cancel-button svg {
                width: 16px;
                height: 16px;
            }
            .delete-all-chats-button {
                flex: 0 0 auto;
                background: var(--bg-card);
                color: var(--text-secondary);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    transform 0.1s ease;
                margin-top: auto;
                margin-left: 10px;
                margin-right: 10px;
                margin-bottom: 10px;
            }
            .delete-all-chats-button:hover:not(:disabled) {
                background: var(--danger);
            }
            .delete-all-chats-button:active:not(:disabled) {
                transform: scale(0.94);
            }
            .delete-all-chats-button:disabled {
                background: var(--bg-card);
                color: var(--text-muted);
                cursor: not-allowed;
            }
            .delete-all-chats-button svg {
                width: 16px;
                height: 16px;
            }

            /* ================================================================
               SETTINGS PANEL
               ================================================================ */

            .settings-backdrop {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.55);
                backdrop-filter: blur(4px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 100;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease;
            }
            .settings-backdrop.open {
                opacity: 1;
                pointer-events: all;
            }

            .settings-panel {
                width: 520px;
                max-width: calc(100vw - 48px);
                max-height: calc(100vh - 80px);
                background: var(--bg-headerbar);
                border: 1px solid var(--border);
                border-radius: 12px;
                box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.7);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                transform: translateY(12px) scale(0.98);
                transition: transform 0.2s ease;
            }
            .settings-backdrop.open .settings-panel {
                transform: translateY(0) scale(1);
            }

            .settings-header {
                flex: 0 0 auto;
                padding: 16px 18px 14px;
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .settings-header-left {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .settings-header-icon {
                width: 28px;
                height: 28px;
                border-radius: 7px;
                background: var(--accent-soft);
                color: var(--accent);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .settings-header-icon svg {
                width: 14px;
                height: 14px;
            }
            .settings-header h2 {
                margin: 0;
                font-size: 14px;
                font-weight: 700;
                color: var(--text-primary);
                letter-spacing: 0.15px;
            }
            .settings-close {
                width: 26px;
                height: 26px;
                border-radius: 6px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--text-muted);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    color 0.15s ease;
            }
            .settings-close:hover {
                background: var(--bg-card-hover);
                color: var(--text-primary);
            }
            .settings-close svg {
                width: 13px;
                height: 13px;
            }

            .settings-body {
                flex: 1 1 auto;
                overflow-y: auto;
                padding: 16px 18px;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .settings-body::-webkit-scrollbar {
                width: 6px;
            }
            .settings-body::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 6px;
            }
            .settings-body::-webkit-scrollbar-track {
                background: transparent;
            }

            /* Loading / error states */
            .settings-state {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 40px 0;
                font-family: var(--font-mono);
                font-size: 12px;
                color: var(--text-muted);
            }
            .settings-state.error {
                color: #ffb4b4;
            }
            .settings-spinner {
                width: 14px;
                height: 14px;
                border: 2px solid var(--border);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }

            /* Group (nested object) */
            .settings-group {
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: auto;
                margin-bottom: 2px;
            }
            .settings-group-header {
                padding: 9px 14px;
                background: rgba(255, 255, 255, 0.03);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                user-select: none;
            }
            .settings-group-header:hover {
                background: rgba(255, 255, 255, 0.05);
            }
            .settings-group-chevron {
                width: 14px;
                height: 14px;
                color: var(--text-muted);
                transition: transform 0.18s ease;
                flex-shrink: 0;
            }
            .settings-group[data-open="true"] .settings-group-chevron {
                transform: rotate(90deg);
            }
            .settings-group-label {
                font-family: var(--font-mono);
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0.5px;
                color: var(--text-secondary);
                flex: 1;
            }
            .settings-group-count {
                font-family: var(--font-mono);
                font-size: 10px;
                color: var(--text-muted);
                background: var(--bg-card);
                border-radius: 4px;
                padding: 1px 5px;
            }
            .settings-group-body {
                padding: 4px;
                display: none;
            }
            .settings-group[data-open="true"] .settings-group-body {
                display: block;
            }

            /* Individual setting row */
            .setting-row {
                display: flex;
                align-items: center;
                padding: 9px 14px;
                gap: 12px;
                transition: background 0.12s ease;
                border-radius: 0;
            }
            .setting-row:hover {
                background: rgba(255, 255, 255, 0.025);
            }
            .setting-row-info {
                flex: 1 1 auto;
                min-width: 0;
            }
            .setting-row-key {
                font-size: 13px;
                color: var(--text-primary);
                font-weight: 400;
            }
            .setting-row-type {
                font-family: var(--font-mono);
                font-size: 10px;
                color: var(--text-muted);
                margin-top: 2px;
            }
            .setting-row-control {
                flex: 0 0 auto;
            }

            /* --- Toggle switch (boolean) --- */
            .toggle-switch {
                position: relative;
                display: inline-block;
                width: 38px;
                height: 22px;
                cursor: pointer;
            }
            .toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
                position: absolute;
            }
            .toggle-track {
                position: absolute;
                inset: 0;
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 11px;
                transition:
                    background 0.2s ease,
                    border-color 0.2s ease;
            }
            .toggle-thumb {
                position: absolute;
                top: 3px;
                left: 3px;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--text-muted);
                transition:
                    transform 0.2s ease,
                    background 0.2s ease;
            }
            .toggle-switch input:checked + .toggle-track {
                background: var(--accent);
                border-color: var(--accent);
            }
            .toggle-switch input:checked + .toggle-track + .toggle-thumb {
                transform: translateX(16px);
                background: #fff;
            }
            .toggle-switch input:checked + .toggle-track {
                /* track active */
            }

            /* --- Text input (string / integer without range) --- */
            .setting-text-input {
                background: var(--bg-void);
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text-primary);
                font-family: var(--font-ui);
                font-size: 13px;
                padding: 5px 9px;
                width: 180px;
                outline: none;
                transition: border-color 0.15s ease;
            }
            .setting-text-input:focus {
                border-color: var(--accent);
            }
            .setting-text-input::placeholder {
                color: var(--text-muted);
            }

            /* --- Slider (integer with min/max) --- */
            .slider-control {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .slider-value-display {
                font-family: var(--font-mono);
                font-size: 12px;
                color: var(--text-secondary);
                min-width: 32px;
                text-align: right;
            }
            input[type="range"].setting-range {
                -webkit-appearance: none;
                width: 130px;
                height: 4px;
                border-radius: 2px;
                background: var(--border);
                outline: none;
                cursor: pointer;
            }
            input[type="range"].setting-range::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--accent);
                border: 2px solid #fff;
                cursor: pointer;
                transition: transform 0.1s ease;
            }
            input[type="range"].setting-range::-webkit-slider-thumb:hover {
                transform: scale(1.15);
            }
            input[type="range"].setting-range::-moz-range-thumb {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--accent);
                border: 2px solid #fff;
                cursor: pointer;
            }

            /* --- Number input (integer without range) --- */
            .setting-number-input {
                background: var(--bg-void);
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text-primary);
                font-family: var(--font-mono);
                font-size: 13px;
                padding: 5px 9px;
                width: 90px;
                outline: none;
                transition: border-color 0.15s ease;
                -moz-appearance: textfield;
            }
            .setting-number-input:focus {
                border-color: var(--accent);
            }
            .setting-number-input::-webkit-inner-spin-button,
            .setting-number-input::-webkit-outer-spin-button {
                -webkit-appearance: none;
            }

            /* Footer */
            .settings-footer {
                flex: 0 0 auto;
                padding: 12px 18px;
                border-top: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 8px;
            }
            .settings-btn {
                padding: 7px 16px;
                border-radius: 7px;
                border: none;
                font-family: var(--font-ui);
                font-size: 13px;
                cursor: pointer;
                transition:
                    background 0.15s ease,
                    opacity 0.15s ease;
            }
            .settings-btn-secondary {
                background: var(--bg-card);
                color: var(--text-secondary);
                border: 1px solid var(--border);
            }
            .settings-btn-secondary:hover {
                background: var(--bg-card-hover);
                color: var(--text-primary);
            }
            .settings-btn-primary {
                background: var(--accent);
                color: #fff;
            }
            .settings-btn-primary:hover {
                background: var(--accent-hover);
            }
            .settings-btn:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            .settings-save-status {
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text-muted);
                margin-right: auto;
                transition: color 0.2s ease;
            }
            .settings-save-status.saved {
                color: var(--success);
            }
            .settings-save-status.error {
                color: var(--danger);
            }
        </style>
    </head>
    <body>
        <div class="app-window">
            <!-- Headerbar -->
            <header class="headerbar">
                <div class="window-controls hidden" aria-hidden="true">
                    <span></span><span></span><span></span>
                </div>
                <div class="headerbar-title">
                    <span class="name">Author v2</span>
                    <span class="endpoint" id="endpoint-label">chat #0</span>
                </div>
                <div class="status-pill" id="status-pill" title="">
                    <span
                        class="status-dot"
                        id="status-dot"
                        data-state="disabled"
                    ></span>
                    <span class="status-message" id="status-label"
                        >connecting…</span
                    >
                </div>
                <button
                    class="icon-button"
                    id="edit-mode-button"
                    type="button"
                    title="Edit raw chat log"
                    aria-label="Edit raw chat log"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 20h9" />
                        <path
                            d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"
                        />
                    </svg>
                </button>
                <button
                    class="icon-button"
                    id="new-chat-button"
                    type="button"
                    title="Start a new chat"
                    aria-label="Start a new chat"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    >
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                </button>
                <button
                    class="icon-button settings"
                    id="settings-button"
                    type="button"
                    title="Settings"
                    aria-label="Open settings"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                        />
                    </svg>
                </button>
            </header>

            <main class="message-window" id="message-window">
                <!-- Chat list (left sidebar) -->
                <nav class="sidebar-panel chat-list" id="chat-list">
                    <span class="sidebar-heading">Chats</span>
                    <div class="chat-item-list" id="chat-item-list"></div>
                    <button
                        class="delete-all-chats-button icon-button"
                        id="delete-all-chats-button"
                        type="button"
                        title="Delete All Chats"
                        aria-label="Delete All Chats"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M3 6h18" />
                            <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
                            <path
                                d="M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"
                            />
                            <path d="M10 11v6" />
                            <path d="M14 11v6" />
                        </svg>
                    </button>
                </nav>

                <!-- Message list / raw-log editor -->
                <div class="message-panel" id="message-panel">
                    <section class="message-list" id="message-list"></section>
                    <textarea
                        class="edit-textarea hidden"
                        id="edit-textarea"
                        spellcheck="false"
                        placeholder="Raw chat transcript…"
                    ></textarea>
                </div>

                <!-- Chat info (right sidebar) -->
                <aside class="sidebar-panel chat-info" id="chat-info">
                    <span class="sidebar-heading">Details</span>
                    <div class="info-field-list" id="info-field-list"></div>
                </aside>
            </main>

            <!-- Composer -->
            <footer class="composer">
                <div class="composer-meta">
                    connected to <span id="api-url-label"></span>
                </div>
                <form class="composer-form" id="chat-form">
                    <textarea
                        id="message-input"
                        class="composer-input"
                        placeholder="Message the assistant… (Shift+Enter for a new line)"
                        autocomplete="off"
                        rows="1"
                    ></textarea>
                    <button
                        type="submit"
                        class="send-button"
                        id="send-button"
                        aria-label="Send message"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" />
                        </svg>
                    </button>
                    <button
                        type="button"
                        class="process-button"
                        id="process-button"
                        aria-label="Process Chat"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="11" cy="11" r="7" />
                            <path d="m20 20-4-4" />
                        </svg>
                    </button>
                    <button
                        type="button"
                        class="cancel-button hidden"
                        id="cancel-button"
                        aria-label="Stop generating"
                        title="Stop generating"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            stroke="none"
                        >
                            <rect x="6" y="6" width="12" height="12" rx="2" />
                        </svg>
                    </button>
                </form>
            </footer>
        </div>

        <!-- ================================================================
             SETTINGS PANEL
             ================================================================ -->
        <div
            class="settings-backdrop"
            id="settings-backdrop"
            role="dialog"
            aria-modal="true"
            aria-labelledby="settings-panel-title"
        >
            <div class="settings-panel" id="settings-panel">
                <div class="settings-header">
                    <div class="settings-header-left">
                        <div class="settings-header-icon">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <circle cx="12" cy="12" r="3" />
                                <path
                                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                                />
                            </svg>
                        </div>
                        <h2 id="settings-panel-title">Settings</h2>
                    </div>
                    <button
                        class="settings-close"
                        id="settings-close-btn"
                        type="button"
                        aria-label="Close settings"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                        >
                            <path d="M18 6 6 18" />
                            <path d="m6 6 12 12" />
                        </svg>
                    </button>
                </div>

                <div class="settings-body" id="settings-body">
                    <div class="settings-state" id="settings-loading">
                        <div class="settings-spinner"></div>
                        Loading settings…
                    </div>
                </div>

                <div class="settings-footer">
                    <span
                        class="settings-save-status"
                        id="settings-save-status"
                    ></span>
                    <button
                        class="settings-btn settings-btn-secondary"
                        id="settings-discard-btn"
                        type="button"
                    >
                        Discard
                    </button>
                    <button
                        class="settings-btn settings-btn-primary"
                        id="settings-save-btn"
                        type="button"
                    >
                        Save changes
                    </button>
                </div>
            </div>
        </div>

        <script>
            "use strict";

            /**
             * ---------------------------------------------------------------------
             * Configuration
             * ---------------------------------------------------------------------
             */
            const CONFIG = {
                apiBaseUrl: "http://192.168.20.43:8000/api/",
                endpoints: {
                    chat: "chat",
                    loadChat: "loadChat",
                    generateID: "generateID",
                    status: "status",
                    listChats: "listChats",
                    updateChat: "updateChat",
                    processChat: "processChat",
                    stop: "stop",
                    deleteChat: "deleteChat",
                    deleteAllChats: "deleteAllChats",
                    regenerateTitle: "regenerateTitle",
                    getSettings: "getSettings",
                    saveSettings: "saveSettings",
                },
                statusPollIntervalMs: 3000,
                markers: {
                    assistant: "{{[INPUT]}}",
                    user: "{{[OUTPUT]}}",
                },
                infoFieldsExcluded: ["text", "title"],
                titleLetterStaggerMs: 16,
                titleLetterOutMs: 200,
                titleLetterInMs: 240,
                composerMaxHeightPx: 140,
                streamLetterStaggerMs: 16,
                streamChunkTimeMs: 300,
                streamLetterAnimationMs: 140,
            };

            /**
             * ---------------------------------------------------------------------
             * State
             * ---------------------------------------------------------------------
             */
            const state = {
                chatId: null,
                unreadChatIds: new Set(),
                rawTranscript: "",
                editMode: false,
                chatInfoData: {},
                // Settings state: deep clone of last loaded settings, mutated by UI
                settingsData: null,
                settingsDirty: false,
            };

            /**
             * ---------------------------------------------------------------------
             * Cached DOM references
             * ---------------------------------------------------------------------
             */
            const dom = {
                messageList: document.getElementById("message-list"),
                editTextarea: document.getElementById("edit-textarea"),
                chatItemList: document.getElementById("chat-item-list"),
                infoFieldList: document.getElementById("info-field-list"),
                chatForm: document.getElementById("chat-form"),
                messageInput: document.getElementById("message-input"),
                sendButton: document.getElementById("send-button"),
                processButton: document.getElementById("process-button"),
                cancelButton: document.getElementById("cancel-button"),
                endpointLabel: document.getElementById("endpoint-label"),
                apiUrlLabel: document.getElementById("api-url-label"),
                statusPill: document.getElementById("status-pill"),
                statusDot: document.getElementById("status-dot"),
                statusLabel: document.getElementById("status-label"),
                newChatButton: document.getElementById("new-chat-button"),
                editModeButton: document.getElementById("edit-mode-button"),
                deleteChatsButton: document.getElementById(
                    "delete-all-chats-button",
                ),
                settingsButton: document.getElementById("settings-button"),
                settingsBackdrop: document.getElementById("settings-backdrop"),
                settingsBody: document.getElementById("settings-body"),
                settingsLoading: document.getElementById("settings-loading"),
                settingsSaveBtn: document.getElementById("settings-save-btn"),
                settingsDiscardBtn: document.getElementById(
                    "settings-discard-btn",
                ),
                settingsCloseBtn: document.getElementById("settings-close-btn"),
                settingsSaveStatus: document.getElementById(
                    "settings-save-status",
                ),
            };

            dom.apiUrlLabel.textContent = CONFIG.apiBaseUrl;

            /* ================================================================
               SETTINGS PANEL LOGIC
               ================================================================ */

            /**
             * Convert a raw key like "use_tools" or "projectId" into a human label.
             */
            function settingLabel(key) {
                return key
                    .replace(/([a-z])([A-Z])/g, "$1 $2")
                    .replace(/[_\-]+/g, " ")
                    .replace(/\b\w/g, (c) => c.toUpperCase())
                    .trim();
            }

            /**
             * Infer the type of a plain setting value.
             * Returns one of: "boolean" | "integer" | "float" | "string" | "group"
             */
            function inferType(value) {
                if (value === null || value === undefined) return "string";
                if (typeof value === "boolean") return "boolean";
                if (typeof value === "number")
                    return Number.isInteger(value) ? "integer" : "float";
                if (typeof value === "string") return "string";
                if (typeof value === "object" && !Array.isArray(value))
                    return "group";
                return "string"; // arrays and anything else fall back to a text field
            }

            /**
             * Build the control element for a single leaf setting and wire up its
             * onChange so state.settingsData is kept in sync.
             *
             * @param {string[]} path  - key path from root, e.g. ["flags", "use_tools"]
             * @param {*}        value - the raw setting value
             */
            function buildControl(path, value) {
                const type = inferType(value);

                const setVal = (v) => {
                    // Walk state.settingsData to the parent, then overwrite the key.
                    let node = state.settingsData;
                    for (let i = 0; i < path.length - 1; i++)
                        node = node[path[i]];
                    node[path[path.length - 1]] = v;
                    state.settingsDirty = true;
                    updateSaveStatus("");
                };

                if (type === "boolean") {
                    const label = document.createElement("label");
                    label.className = "toggle-switch";
                    label.title = value ? "Enabled" : "Disabled";

                    const input = document.createElement("input");
                    input.type = "checkbox";
                    input.checked = Boolean(value);
                    input.addEventListener("change", () => {
                        setVal(input.checked);
                        label.title = input.checked ? "Enabled" : "Disabled";
                    });

                    const track = document.createElement("span");
                    track.className = "toggle-track";
                    const thumb = document.createElement("span");
                    thumb.className = "toggle-thumb";

                    label.appendChild(input);
                    label.appendChild(track);
                    label.appendChild(thumb);
                    return label;
                }

                if (type === "integer" || type === "float") {
                    const input = document.createElement("input");
                    input.type = "number";
                    input.className = "setting-number-input";
                    input.value = value;
                    input.step = type === "float" ? "any" : "1";
                    input.addEventListener("change", () => {
                        const v =
                            type === "float"
                                ? parseFloat(input.value)
                                : parseInt(input.value, 10);
                        setVal(isNaN(v) ? value : v);
                    });
                    return input;
                }

                if (type === "string") {
                    const input = document.createElement("input");
                    input.type = "text";
                    input.className = "setting-text-input";
                    input.value = String(value ?? "");
                    input.placeholder = "—";
                    input.addEventListener("input", () => setVal(input.value));
                    return input;
                }

                // Fallback for arrays / unknown types
                const input = document.createElement("input");
                input.type = "text";
                input.className = "setting-text-input";
                input.value = JSON.stringify(value);
                input.placeholder = "—";
                input.addEventListener("input", () => {
                    try {
                        setVal(JSON.parse(input.value));
                    } catch {
                        setVal(input.value);
                    }
                });
                return input;
            }

            /**
             * Build a single setting row (label + inferred type hint + control).
             */
            function buildSettingRow(key, value, path) {
                const row = document.createElement("div");
                row.className = "setting-row";

                const info = document.createElement("div");
                info.className = "setting-row-info";

                const keyEl = document.createElement("div");
                keyEl.className = "setting-row-key";
                keyEl.textContent = settingLabel(key);

                const typeEl = document.createElement("div");
                typeEl.className = "setting-row-type";
                typeEl.textContent = inferType(value);

                info.appendChild(keyEl);
                info.appendChild(typeEl);

                const controlWrapper = document.createElement("div");
                controlWrapper.className = "setting-row-control";
                controlWrapper.appendChild(buildControl(path, value));

                row.appendChild(info);
                row.appendChild(controlWrapper);
                return row;
            }

            /**
             * Recursively render a settings object into the given container.
             * Plain objects become collapsible groups; all other values become rows.
             */
            function renderSettingsObject(obj, container, pathPrefix) {
                for (const [key, value] of Object.entries(obj)) {
                    const path = [...pathPrefix, key];

                    if (inferType(value) === "group") {
                        // Nested object → collapsible group
                        const group = document.createElement("div");
                        group.className = "settings-group";
                        group.dataset.open = "true";

                        const header = document.createElement("div");
                        header.className = "settings-group-header";
                        header.setAttribute("role", "button");
                        header.setAttribute("aria-expanded", "true");

                        const chevron = document.createElementNS(
                            "http://www.w3.org/2000/svg",
                            "svg",
                        );
                        chevron.setAttribute("viewBox", "0 0 24 24");
                        chevron.setAttribute("fill", "none");
                        chevron.setAttribute("stroke", "currentColor");
                        chevron.setAttribute("stroke-width", "2");
                        chevron.setAttribute("stroke-linecap", "round");
                        chevron.setAttribute("class", "settings-group-chevron");
                        chevron.innerHTML = `<path d="M9 18l6-6-6-6"/>`;

                        const labelEl = document.createElement("span");
                        labelEl.className = "settings-group-label";
                        labelEl.textContent = settingLabel(key);

                        const count = Object.keys(value).length;
                        const countEl = document.createElement("span");
                        countEl.className = "settings-group-count";
                        countEl.textContent = count;

                        header.appendChild(chevron);
                        header.appendChild(labelEl);
                        header.appendChild(countEl);

                        const body = document.createElement("div");
                        body.className = "settings-group-body";

                        header.addEventListener("click", () => {
                            const isOpen = group.dataset.open === "true";
                            group.dataset.open = isOpen ? "false" : "true";
                            header.setAttribute(
                                "aria-expanded",
                                String(!isOpen),
                            );
                        });

                        group.appendChild(header);
                        group.appendChild(body);
                        container.appendChild(group);

                        // Recurse into the nested object
                        renderSettingsObject(value, body, path);
                    } else {
                        // Leaf setting — pass the raw value directly
                        container.appendChild(
                            buildSettingRow(key, value, path),
                        );
                    }
                }
            }

            /**
             * Fetch settings from the backend, deep-clone into state, then render.
             */
            async function loadSettings() {
                dom.settingsBody.innerHTML = "";
                const loading = document.createElement("div");
                loading.className = "settings-state";
                loading.innerHTML = `<div class="settings-spinner"></div> Loading settings…`;
                dom.settingsBody.appendChild(loading);

                dom.settingsSaveBtn.disabled = true;
                dom.settingsDiscardBtn.disabled = true;
                updateSaveStatus("");

                try {
                    const resp = await fetch(
                        CONFIG.apiBaseUrl + CONFIG.endpoints.getSettings,
                    );
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const data = await resp.json();

                    state.settingsData = JSON.parse(JSON.stringify(data)); // deep clone
                    state.settingsDirty = false;

                    dom.settingsBody.innerHTML = "";
                    renderSettingsObject(
                        state.settingsData,
                        dom.settingsBody,
                        [],
                    );

                    dom.settingsSaveBtn.disabled = false;
                    dom.settingsDiscardBtn.disabled = false;
                } catch (err) {
                    dom.settingsBody.innerHTML = "";
                    const errEl = document.createElement("div");
                    errEl.className = "settings-state error";
                    errEl.textContent = `Could not load settings: ${err.message}`;
                    dom.settingsBody.appendChild(errEl);
                }
            }

            /**
             * POST the current state.settingsData (a plain dict mirroring what
             * the backend sent) back to saveSettings.
             */
            async function saveSettings() {
                dom.settingsSaveBtn.disabled = true;
                updateSaveStatus("");

                try {
                    const resp = await fetch(
                        CONFIG.apiBaseUrl + CONFIG.endpoints.saveSettings,
                        {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                settings: state.settingsData,
                            }),
                        },
                    );
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

                    state.settingsDirty = false;
                    updateSaveStatus("saved");
                    setTimeout(() => {
                        if (!state.settingsDirty) updateSaveStatus("");
                    }, 2500);

                    closeSettings();
                } catch (err) {
                    updateSaveStatus("error", `Save failed: ${err.message}`);
                } finally {
                    dom.settingsSaveBtn.disabled = false;
                }
            }

            function updateSaveStatus(kind, msg) {
                dom.settingsSaveStatus.className =
                    "settings-save-status" + (kind ? ` ${kind}` : "");
                dom.settingsSaveStatus.textContent =
                    msg || (kind === "saved" ? "Changes saved" : "");
            }

            function openSettings() {
                dom.settingsBackdrop.classList.add("open");
                loadSettings();
                // Trap focus to the panel
                setTimeout(() => dom.settingsCloseBtn.focus(), 50);
            }

            function closeSettings() {
                dom.settingsBackdrop.classList.remove("open");
            }

            // Wire up settings open/close
            dom.settingsButton.addEventListener("click", openSettings);
            dom.settingsCloseBtn.addEventListener("click", closeSettings);
            dom.settingsDiscardBtn.addEventListener("click", closeSettings);
            dom.settingsSaveBtn.addEventListener("click", saveSettings);

            // Click outside panel to close
            dom.settingsBackdrop.addEventListener("click", (e) => {
                if (e.target === dom.settingsBackdrop) closeSettings();
            });

            // Escape key closes
            document.addEventListener("keydown", (e) => {
                if (
                    e.key === "Escape" &&
                    dom.settingsBackdrop.classList.contains("open")
                ) {
                    closeSettings();
                }
            });

            /* ================================================================
               REST OF THE APP (unchanged from original)
               ================================================================ */

            const ICONS = {
                assistant: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M9 12v2M15 12v2"/></svg>`,
                edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
                save: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`,
                trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>`,
                regenerate: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L23 8"/><path d="M3 3v6h6"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L1 16"/><path d="M21 21v-6h-6"/></svg>`,
            };

            const THINK_BLOCK_PATTERN = /<think>([\s\S]*?)<\/think>/gi;

            function splitThinkSegments(text) {
                const segments = [];
                let lastIndex = 0,
                    match;
                THINK_BLOCK_PATTERN.lastIndex = 0;
                while ((match = THINK_BLOCK_PATTERN.exec(text)) !== null) {
                    if (match.index > lastIndex)
                        segments.push({
                            type: "text",
                            content: text.slice(lastIndex, match.index),
                            startIndex: lastIndex,
                            endIndex: match.index,
                        });
