<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AI Chat Assistant</title>
        <!-- Tailwind CSS for styling -->
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-slate-900 text-slate-100 h-screen flex flex-col">
        <!-- Header -->
        <header
            class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md"
        >
            <h1 class="text-xl font-bold text-indigo-400">
                GNOME AI Assistant
            </h1>
            <div class="flex items-center space-x-4">
                <span class="text-sm text-slate-400"
                    >Chat ID:
                    <strong id="chat-id-display" class="text-slate-200"
                        >2</strong
                    ></span
                >
                <button
                    onclick="newChat()"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded text-sm transition"
                >
                    New Chat
                </button>
            </div>
        </header>

        <!-- Chat Messages Container -->
        <main
            id="chat-container"
            class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto"
        >
            <!-- Messages will dynamically appear here -->
            <div class="flex justify-start">
                <div
                    class="bg-slate-800 border border-slate-700 text-slate-300 p-3 rounded-lg max-w-lg shadow"
                >
                    Hello! Send a message below to start chatting with your AI
                    backend.
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="bg-slate-800 border-t border-slate-700 p-4 shadow-lg">
            <form
                id="chat-form"
                onsubmit="sendMessage(event)"
                class="max-w-3xl mx-auto flex gap-2"
            >
                <input
                    type="text"
                    id="message-input"
                    placeholder="Type your message here..."
                    autocomplete="off"
                    required
                    class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500"
                />
                <button
                    type="submit"
                    id="send-button"
                    class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2 rounded-lg transition"
                >
                    Send
                </button>
            </form>
        </footer>

        <!-- JavaScript Logic -->
        <script>
            let chatId = 2;
            const API_URL = "http://127.0.0.1:8000/api/chat";

            function newChat() {
                chatId += 1;
                document.getElementById("chat-id-display").innerText = chatId;
                const container = document.getElementById("chat-container");
                container.innerHTML = `
                <div class="flex justify-start">
                    <div class="bg-slate-800 border border-slate-700 text-slate-300 p-3 rounded-lg max-w-lg shadow">
                        Started a new chat session (ID: ${chatId}).
                    </div>
                </div>
            `;
            }

            async function sendMessage(event) {
                event.preventDefault();

                const inputField = document.getElementById("message-input");
                const sendButton = document.getElementById("send-button");
                const container = document.getElementById("chat-container");
                const userMessage = inputField.value.trim();

                if (!userMessage) return;
                addUserMessage(userMessage);

                inputField.value = "";
                inputField.disabled = true;
                sendButton.disabled = true;
                container.scrollTop = container.scrollHeight;

                // 2. Add temporary loading bubble
                const loadingId = "loading-" + Date.now();
                container.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-slate-800 border border-slate-700 text-slate-400 p-3 rounded-lg max-w-lg shadow animate-pulse">
                        Thinking...
                    </div>
                </div>
            `;
                container.scrollTop = container.scrollHeight;

                function addBotMessage(message) {
                    container.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-slate-800 border border-slate-700 text-slate-200 p-3 rounded-lg max-w-lg shadow">
                            ${escapeHtml(message)}
                        </div>
                    </div>
                `;
                }

                function addUserMessage(message) {
                    container.innerHTML += `
                    <div class="flex justify-end">
                        <div class="bg-indigo-600 text-white p-3 rounded-lg max-w-lg shadow">
                            ${escapeHtml(message)}
                        </div>
                    </div>
                `;
                }

                try {
                    // 3. Send request to FastAPI backend
                    const response = await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            chat_id: chatId,
                            message: userMessage,
                        }),
                    });

                    if (!response.ok)
                        throw new Error("Failed to communicate with server.");

                    const data = await response.json();
                    document.getElementById(loadingId).remove();
                    var chatText = escapeHtml(data.text);

                    var delimiter = 0;
                    var inIdx = chatText.indexOf("{{[INPUT]}}");
                    var outIdx = chatText.indexOf("{{[OUTPUT]}}");
                    while (delimiter != -1) {
                        console.log(delimiter);
                        inIdx = chatText.indexOf("{{[INPUT]}}");
                        outIdx = chatText.indexOf("{{[OUTPUT]}}");
                        if (inIdx == -1 && outIdx == -1) {
                            delimiter = -1;
                        } else {
                            if (inIdx <= outIdx) {
                                text = chatText.substring(0, inIdx);
                                chatText = chatText.substring(
                                    inIdx + "{{[INPUT]}}".length,
                                );
                                addBotMessage(text);
                            } else {
                                text = chatText.substring(0, outIdx);
                                chatText = chatText.substring(
                                    outIdx + "{{[OUTPUT]}}".length,
                                );
                                addUserMessage(text);
                            }
                        }
                    }
                    if (inIdx <= outIdx) {
                        addBotMessage(chatText);
                    } else {
                        addUserMessage(chatText);
                    }
                } catch (error) {
                    document.getElementById(loadingId).remove();
                    container.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-red-900 border border-red-700 text-red-200 p-3 rounded-lg max-w-lg shadow">
                            Error: Could not connect to the backend server. Make sure FastAPI is running.
                            Error Code: ${error}
                        </div>
                    </div>
                `;
                } finally {
                    inputField.disabled = false;
                    sendButton.disabled = false;
                    inputField.focus();
                    container.scrollTop = container.scrollHeight;
                }
            }

            // Simple XSS protection utility
            function escapeHtml(text) {
                const map = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;",
                };
                return text.replace(/[&<>"']/g, (m) => map[m]);
            }
        </script>
    </body>
</html>
